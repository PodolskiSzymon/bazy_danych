ta posting_families (rodziny ogłoszeń), similar_posting_pairs (pary podobnych ogłoszeń), employer_signals (sygnały firm), report_verdicts (oceny zgłoszeń) i appeals (odwołania firm).", "zapisuje": "Jest jedynym programem, który zapisuje do case_files. Jeden wiersz to jedna teczka: której firmy dotyczy, zebrane fakty i streszczenie.", "uruchamia": "Uruchamia go wynik blisko progu ostrzeżenia albo nowe odwołanie zapisane przez Przyjmowacza odwołań firm. Z modelem AI łączy się przez Pośrednika zapytań do AI. Teczkę ogląda moderator w Zapisywaczu decyzji moderatora.", "skroty": "Teczka sprawy – jeden wpis w case_files z faktami i streszczeniem, przygotowany dla moderatora."}}, {"key": "publikator-trust-score", "kind": "prog", "name": "Publikator Trust Score", "sub": "publish_trust_score.py", "fields": [["Działa:", "decyduje, co zobaczy kandydat"], ["Analizuje:", "mała pewność → „za mało danych”; spadek do ostrzeżenia → najpierw moderator"], ["Oddaje:", "published_trust_scores"]], "reads": ["trust_score_history", "moderator_decisions", "system_parameters"], "writes": ["published_trust_scores"], "role": {"kim": "Publikator Trust Score (plik publish_trust_score.py) decyduje, który wynik z trust_score_history można pokazać kandydatom i firmom, i zapisuje go w published_trust_scores. Pilnuje, żebyśmy nie ostrzegali przed firmą na podstawie zbyt małej liczby dowodów albo bez zgody człowieka.", "zadania": ["Pobrać nowy wynik z trust_score_history.", "Jeśli pewność jest niższa niż próg z system_parameters – opublikować „za mało danych” zamiast liczby.", "Jeśli wynik spadł do strefy ostrzeżenia – nie publikować go od razu, tylko oznaczyć jako wstrzymany. Sprawa trafia do moderation_queue i czeka na decyzję moderatora w moderator_decisions.", "Pozostałe zmiany wyniku publikować od razu."], "korzysta": "Czyta trust_score_history (wyniki robocze), moderator_decisions (decyzje moderatorów) i system_parameters (progi pewności i strefy ostrzeżenia).", "zapisuje": "Jest jedynym programem, który zapisuje do published_trust_scores. To jedyny zbiór z wynikami, który widzą kandydaci (odznaka przy ofercie) i firmy (strona Przyjmowacza odwołań firm).", "uruchamia": "Uruchamiają go Wystawiacz Trust Score (nowy wynik) i Zapisywacz decyzji moderatora (zatwierdzenie albo odrzucenie ostrzeżenia). Wstrzymane wyniki moderator widzi w Zapisywaczu decyzji moderatora."}}, {"key": "zbieracz-danych-treningowych", "kind": "prog", "name": "Zbieracz danych treningowych", "sub": "build_training_dataset.py", "fields": [["Działa:", "składa materiał do nauki modelu"], ["Analizuje:", "sygnały firm i decyzje moderatorów jako poprawne odpowiedzi (etykiety)"], ["Oddaje:", "training_datasets – bez danych osób"]], "reads": ["employer_signals", "posting_lifecycles", "moderator_decisions"], "writes": ["training_datasets"], "role": {"kim": "Zbieracz danych treningowych (plik build_training_dataset.py) przygotowuje zestaw przykładów, na których uczy się model Trust Score. Jeden przykład to sygnały jednej firmy i poprawna odpowiedź (etykieta) – decyzja moderatora, np. „ta firma publikuje ghost joby”.", "zadania": ["Połączyć sygnały firm z employer_signals i posting_lifecycles z decyzjami moderatorów z moderator_decisions.", "Usunąć z zestawu wszystkie dane, które mogłyby wskazać osobę (pseudonimy, skróty urządzeń).", "Zapisać zestaw w training_datasets jako nową wersję z datą, żeby naukę modelu dało się powtórzyć na tych samych danych."], "korzysta": "Czyta employer_signals (sygnały firm), posting_lifecycles (cykle życia ogłoszeń) i moderator_decisions (decyzje moderatorów).", "zapisuje": "Jest jedynym programem, który zapisuje do training_datasets. Jeden wiersz to jedna wersja zestawu przykładów.", "uruchamia": "Uruchamia go ręcznie analityk danych (członek personelu). Z training_datasets korzysta Trener sztucznej inteligencji.", "skroty": "Etykieta – poprawna odpowiedź przypisana do przykładu."}}, {"key": "trener-ai", "kind": "prog", "name": "Trener sztucznej inteligencji", "sub": "train_and_evaluate_model.py", "fields": [["Działa:", "uczy model i sprawdza go na danych, których wcześniej nie widział"], ["Analizuje:", "czy nowy model jest lepszy od reguł"], ["Oddaje:", "model_registry; model działa dopiero po zatwierdzeniu"]], "reads": ["training_datasets"], "writes": ["model_registry"], "role": {"kim": "Trener sztucznej inteligencji (plik train_and_evaluate_model.py) uczy model, który w przyszłości ma liczyć Trust Score zamiast ręcznie ustawionych wag, i sprawdza, czy ten model działa lepiej od obecnych zasad.", "zadania": ["Podzielić zestaw z training_datasets na część do nauki i część testową (przykłady, których model podczas nauki nie widzi).", "Nauczyć model na części do nauki.", "Sprawdzić model na części testowej i porównać jego wyniki z obecnymi zasadami (wagami z system_parameters).", "Zapisać w model_registry: wersję modelu, użyty zestaw danych, wynik testu i stan „czeka na zatwierdzenie”. Wystawiacz Trust Score zaczyna używać modelu dopiero wtedy, gdy człowiek zmieni stan na „aktywny”."], "korzysta": "Czyta training_datasets (zestawy przykładów).", "zapisuje": "Jest jedynym programem, który zapisuje do model_registry. Jeden wiersz to jedna wersja modelu z wynikiem testu i stanem.", "uruchamia": "Uruchamia go ręcznie analityk danych. Aktywny model odczytuje z model_registry Wystawiacz Trust Score.", "skroty": "Model – program, który nauczył się liczyć wynik na podstawie przykładów. Część testowa – przykłady odłożone na bok, żeby sprawdzić model na danych, których nie znał."}}], "stores": [{"key": "employer_signals", "kind": "store", "name": "employer_signals", "sub": "sygnały pracodawców", "fields": [["Przechowuje:", "dla każdej firmy na każdy dzień wszystkie składowe oceny"], ["Po co:", "wejście dla Wystawiacza Trust Score, historia zmian i materiał do nauki modelu"]]}, {"key": "trust_score_history", "kind": "store", "name": "trust_score_history", "sub": "historia Trust Score", "fields": [["Przechowuje:", "każdy wyliczony wynik: firmę, datę, wynik, pewność, powody, wersję modelu"], ["Po co:", "widać, jak i dlaczego wynik się zmieniał – potrzebne przy odwołaniu i w sporze"]]}, {"key": "published_trust_scores", "kind": "store", "name": "published_trust_scores", "sub": "opublikowane wyniki", "fields": [["Przechowuje:", "to, co widzi kandydat: wynik albo „za mało danych”, od kiedy, czy wstrzymany"], ["Po co:", "odznaka i panel firmy czytają tylko ten zbiór, nigdy wyniku roboczego"]]}, {"key": "case_files", "kind": "store", "name": "case_files", "sub": "teczki spraw", "fields": [["Przechowuje:", "streszczenie dowodów od modelu AI"], ["Po co:", "moderator decyduje szybciej i na podstawie dowodów, a nie samego wyniku"]]}, {"key": "training_datasets", "kind": "store", "name": "training_datasets", "sub": "zbiory treningowe", "fields": [["Przechowuje:", "kolejne wersje: sygnały + etykiety, bez danych osób"], ["Po co:", "na nich uczy się przyszły model; wersje pozwalają powtórzyć naukę"]]}, {"key": "model_registry", "kind": "store", "name": "model_registry", "sub": "rejestr modeli", "fields": [["Przechowuje:", "wersję modelu, zbiór treningowy, wynik testu, stan i to, kto zatwierdził"], ["Po co:", "wiadomo, który model wystawił wynik; można wrócić do poprzedniego"]]}]}, {"id": 5, "name": "Biuro Obsługi", "mapTitle": "5. Biuro Obsługi", "storeGroup": "Kontakt i decyzje", "finding": "tu system rozmawia z ludźmi – kandydatem, firmą, moderatorem i IOD", "link": "Decyzje moderatorów wracają do warstw 3 i 4, które oceniają sprawę ponownie.", "band1": "Z KIM ROZMAWIA TA WARSTWA", "arrow1": "ludzie korzystają z programów", "note": "Pomocniczy zbiór: badge_view_stats (ile razy dziennie pokazano odznakę danej oferty).", "mapSources": [{"kind": "person", "name": "Kandydat", "detail": "widzi odznakę oferty"}, {"kind": "person", "name": "Pracodawca", "detail": "wynik i odwołanie"}, {"kind": "person", "name": "Moderator, IOD", "detail": "decyzje, wnioski RODO"}], "flowNext": "zbiory zaplecza poniżej czytają wszystkie warstwy", "sources": [{"key": "kandydat-odznaka", "kind": "person", "name": "Kandydat", "sub": "osoba szukająca pracy", "fields": [["Dostaje:", "odznakę przy ofercie: wynik, pewność, 2–3 powody albo „za mało danych”"], ["Jak:", "przez widżet trust_badge.js na stronie platformy"]], "talks": ["wyswietlacz-odznak", "realizator-rodo"], "role": {"kim": "Ten sam kandydat co w warstwie 3, ale tutaj odbiera informację od systemu. Gdy otwiera ofertę na pracuj.pl albo OLX, widzi przy niej odznakę z Trust Score firmy – zanim wyśle CV.", "zadania": ["Zobaczyć przy ofercie: wynik firmy, pewność i 2–3 powody albo napis „za mało danych”.", "Zobaczyć fakty o samym ogłoszeniu, np. „to ogłoszenie publikowane jest 6. raz”.", "Złożyć przez platformę wniosek RODO, np. o wgląd w swoje dane albo ich usunięcie."], "korzysta": "Nie ma dostępu do bazy. Odznakę przygotowuje dla niego Wyświetlacz odznak zaufania na podstawie published_trust_scores i posting_lifecycles.", "zapisuje": "Sam nic nie zapisuje. Wniosek RODO zapisuje Realizator wniosków RODO w privacy_requests.", "uruchamia": "Otwarcie oferty uruchamia Wyświetlacza odznak zaufania (przez widżet trust_badge.js). Wniosek RODO uruchamia Realizatora wniosków RODO."}}, {"key": "pracodawca", "kind": "person", "name": "Pracodawca", "sub": "firma oceniana przez system (też agencja)", "fields": [["Dostaje:", "swój wynik i powody"], ["Daje:", "odwołania, np. „stanowisko obsadzone”"], ["Jak:", "loguje się przez platformę i potwierdza NIP"]], "talks": ["przyjmowacz-odwolan"], "role": {"kim": "Pracodawca to firma albo agencja rekrutacyjna, którą ocenia system. Ma prawo zobaczyć swój wynik, poznać jego powody i złożyć odwołanie, jeśli się z nim nie zgadza.", "zadania": ["Zalogować się przez platformę i potwierdzić, że to naprawdę ta firma (podając NIP).", "Zobaczyć swój wynik, jego powody i rodziny swoich ogłoszeń.", "Złożyć odwołanie, np. „stanowisko obsadzone” albo „to nie nasze ogłoszenie” (gdy ktoś podszywa się pod firmę)."], "korzysta": "Nie ma bezpośredniego dostępu do bazy. Na stronie Przyjmowacza odwołań firm widzi dane z published_trust_scores (swój wynik), employer_signals (sygnały), posting_families (rodziny swoich ogłoszeń), employers i moderator_decisions (rozstrzygnięcia swoich odwołań).", "zapisuje": "Sam nic nie zapisuje. Odwołanie zapisuje Przyjmowacz odwołań firm w appeals.", "uruchamia": "Złożenie odwołania uruchamia Kompletowacza teczek spraw, a sprawa trafia do moderation_queue."}}, {"key": "moderator", "kind": "person", "name": "Moderator", "sub": "nasz pracownik", "fields": [["Robi:", "rozstrzyga sprawy sporne i zatwierdza ostrzeżenia"]], "talks": ["zapisywacz-decyzji"], "role": {"kim": "Moderator to nasz pracownik, który podejmuje decyzje w sprawach, których nie powinien rozstrzygać sam automat: wątpliwe zgłoszenia, podejrzane grupy zgłoszeń, odwołania firm i ostrzeżenia czekające na publikację.", "zadania": ["Przejrzeć moderation_queue: zgłoszenia „do moderacji”, alerty z abuse_alerts, odwołania z appeals i wstrzymane wyniki z published_trust_scores.", "Obejrzeć teczkę sprawy z case_files i pozostałe dowody, podjąć decyzję i wpisać uzasadnienie."], "korzysta": "Przez Zapisywacza decyzji moderatora czyta moderation_queue (widok), case_files (teczki spraw), reports (zgłoszenia, bez danych osobowych), similar_posting_pairs (pary podobnych ogłoszeń) i appeals (odwołania).", "zapisuje": "Sam nic nie zapisuje bezpośrednio. Decyzję zapisuje Zapisywacz decyzji moderatora w moderator_decisions.", "uruchamia": "Każda decyzja uruchamia ponowne przeliczenie przez Oceniacza wiarygodności zgłoszeń, Publikatora Trust Score i Wyliczacza sygnałów o firmach."}}, {"key": "iod", "kind": "person", "name": "IOD – Inspektor Ochrony Danych", "sub": "osoba odpowiedzialna za RODO", "fields": [["Robi:", "pilnuje wniosków kandydatów, terminów przechowywania i audytu"]], "talks": ["realizator-rodo"], "role": {"kim": "IOD, czyli Inspektor Ochrony Danych, to osoba w naszym zespole odpowiedzialna za przestrzeganie RODO – przepisów o ochronie danych osobowych.", "zadania": ["Dopilnować, żeby wnioski kandydatów (wgląd w dane, usunięcie danych, sprzeciw) były wykonane w terminie.", "Pilnować terminów przechowywania danych zapisanych w system_parameters.", "Przeglądać audit_log: kto i kiedy czytał dane osobowe."], "korzysta": "Czyta privacy_requests (wnioski RODO), consents (zgody) i audit_log (dziennik audytu).", "zapisuje": "Sam nic nie zapisuje bezpośrednio. Wnioski zapisuje Realizator wniosków RODO w privacy_requests.", "uruchamia": "Może ręcznie uruchomić Realizatora wniosków RODO i Generatora raportów publicznych (pakiet danych dla instytucji).", "skroty": "IOD – Inspektor Ochrony Danych. RODO – przepisy o ochronie danych osobowych."}}], "programs": [{"key": "wyswietlacz-odznak", "kind": "prog", "name": "Wyświetlacz odznak zaufania", "sub": "serve_trust_badge.py", "fields": [["Działa:", "gdy kandydat otwiera ofertę, widżet pyta Wyświetlacza odznak zaufania o odznakę"], ["Analizuje:", "oferta → firma → opublikowany wynik oraz fakty, np. „publikowane 6. raz”"], ["Oddaje:", "odznakę i dzienne liczniki wyświetleń (bez danych osób)"]], "reads": ["job_postings", "employer_account_links", "published_trust_scores", "posting_lifecycles"], "writes": ["badge_view_stats"], "role": {"kim": "Wyświetlacz odznak zaufania (plik serve_trust_badge.py) przygotowuje odznakę, którą kandydat widzi przy ofercie. Gdy kandydat otwiera ofertę, widżet trust_badge.js wysyła do niego identyfikator ogłoszenia, a on odsyła wynik firmy i fakty o ogłoszeniu.", "zadania": ["Na podstawie identyfikatora ogłoszenia znaleźć w job_postings konto firmy, a w employer_account_links – firmę, do której to konto należy.", "Pobrać z published_trust_scores opublikowany wynik firmy albo „za mało danych”. Nigdy nie czyta wyniku roboczego z trust_score_history.", "Pobrać z posting_lifecycles fakty o rodzinie tego ogłoszenia, np. liczbę publikacji.", "Odesłać widżetowi odznakę: wynik, pewność, 2–3 powody i fakty o ogłoszeniu.", "Zwiększyć dzienny licznik wyświetleń odznaki tej oferty w badge_view_stats – bez zapisywania, kto ją oglądał."], "korzysta": "Czyta job_postings (ogłoszenia), employer_account_links (powiązania kont z firmami), published_trust_scores (opublikowane wyniki) i posting_lifecycles (cykle życia ogłoszeń).", "zapisuje": "Jest jedynym programem, który zapisuje do badge_view_stats. Jeden wiersz to liczba wyświetleń odznaki jednej oferty w jednym dniu.", "uruchamia": "Uruchamia go widżet trust_badge.js przy każdym otwarciu oferty (przez Kontrolera kluczy API). Z badge_view_stats korzysta Generator raportów publicznych."}}, {"key": "przyjmowacz-odwolan", "kind": "prog", "name": "Przyjmowacz odwołań firm", "sub": "employer_panel", "fields": [["Działa:", "strona dla firm: wynik, powody i rodziny ogłoszeń"], ["Analizuje:", "przyjmuje odwołania, np. „stanowisko obsadzone” albo „to nie nasze ogłoszenie”"], ["Oddaje:", "appeals"]], "reads": ["published_trust_scores", "employer_signals", "posting_families", "employers", "moderator_decisions"], "writes": ["appeals"], "role": {"kim": "Przyjmowacz odwołań firm (moduł employer_panel) to strona internetowa dla pracodawców. Firma loguje się przez platformę, widzi swój wynik i jego powody, a jeśli się z nim nie zgadza, składa odwołanie, które ten program zapisuje w appeals.", "zadania": ["Pokazać firmie: opublikowany wynik z published_trust_scores, sygnały z employer_signals i rodziny jej ogłoszeń z posting_families.", "Przyjąć odwołanie: którego wyniku albo ogłoszenia dotyczy, rodzaj (np. „stanowisko obsadzone”, „to nie nasze ogłoszenie”), treść i załączniki.", "Zapisać odwołanie w appeals.", "Pokazać rozstrzygnięcie, gdy moderator zapisze decyzję w moderator_decisions."], "korzysta": "Czyta published_trust_scores (opublikowane wyniki), employer_signals (sygnały firm), posting_families (rodziny ogłoszeń), employers (firmy) i moderator_decisions (decyzje moderatorów).", "zapisuje": "Jest jedynym programem, który zapisuje do appeals. Jeden wiersz to jedno odwołanie: firma, czego dotyczy, rodzaj, treść, załączniki i data.", "uruchamia": "Uruchamia go pracodawca, gdy wchodzi na stronę. Nowe odwołanie uruchamia Kompletowacza teczek spraw i trafia do moderation_queue."}}, {"key": "zapisywacz-decyzji", "kind": "prog", "name": "Zapisywacz decyzji moderatora", "sub": "moderation_panel", "fields": [["Działa:", "pokazuje moderatorowi kolejkę spraw razem z teczkami"], ["Analizuje:", "człowiek ogląda dowody i decyduje"], ["Oddaje:", "moderator_decisions z uzasadnieniem"]], "reads": ["moderation_queue", "case_files", "reports", "similar_posting_pairs", "appeals"], "writes": ["moderator_decisions"], "role": {"kim": "Zapisywacz decyzji moderatora (moduł moderation_panel) to strona internetowa, na której pracuje moderator: widzi listę spraw czekających na decyzję, otwiera dowody i zapisuje decyzję z uzasadnieniem w moderator_decisions.", "zadania": ["Pokazać listę spraw z moderation_queue: zgłoszenia „do moderacji”, alerty, odwołania i wstrzymane wyniki.", "Dla wybranej sprawy pokazać teczkę z case_files, zgłoszenia z reports (bez pseudonimów), pary podobnych ogłoszeń z similar_posting_pairs i odwołanie z appeals.", "Zapisać w moderator_decisions: czego dotyczy decyzja, samą decyzję, uzasadnienie, kto i kiedy ją podjął."], "korzysta": "Czyta moderation_queue (kolejka spraw – widok), case_files (teczki spraw), reports (zgłoszenia), similar_posting_pairs (pary podobnych ogłoszeń) i appeals (odwołania).", "zapisuje": "Jest jedynym programem, który zapisuje do moderator_decisions.", "uruchamia": "Uruchamia go moderator. Każda zapisana decyzja uruchamia Oceniacza wiarygodności zgłoszeń, Publikatora Trust Score i Wyliczacza sygnałów o firmach."}}, {"key": "realizator-rodo", "kind": "prog", "name": "Realizator wniosków RODO", "sub": "handle_privacy_request.py", "fields": [["Działa:", "przyjmuje wnioski kandydatów (wgląd, usunięcie, sprzeciw) przekazane przez platformę"], ["Analizuje:", "które zbiory mają dane tego pseudonimu"], ["Oddaje:", "zlecenia usunięcia dla właścicieli zbiorów i wpis w privacy_requests"]], "reads": ["consents"], "writes": ["privacy_requests"], "role": {"kim": "Realizator wniosków RODO (plik handle_privacy_request.py) wykonuje wnioski kandydatów dotyczące ich danych: wgląd („pokażcie, co o mnie macie”), usunięcie albo sprzeciw. Sam nie usuwa danych z cudzych zbiorów – wysyła zlecenia usunięcia do programów, które są właścicielami tych zbiorów, bo do każdego zbioru może zapisywać tylko jego właściciel.", "zadania": ["Przyjąć wniosek przekazany przez platformę (tylko ona wie, kim jest kandydat) albo wpisany przez IOD.", "Znaleźć zbiory, w których jest pseudonim kandydata.", "Wysłać przez task_queue zlecenia usunięcia do właścicieli tych zbiorów: Przyjmowacza zgłoszeń kandydatów (reports), Odsiewacza botów (bot_checks), Oceniacza wiarygodności zgłoszeń (report_verdicts), Importera logu aplikacji (application_log), Porównywacza odcisków urządzeń (device_fingerprints), Rejestratora zgód kandydatów (consents) i Wysyłacza przypomnień (reminders_sent).", "Zapisać w privacy_requests, że wniosek wykonano i kiedy – bez treści usuniętych danych."], "korzysta": "Czyta consents (zgody) i – tylko do odczytu – zbiory, w których może być pseudonim kandydata.", "zapisuje": "Jest jedynym programem, który zapisuje do privacy_requests. Jeden wiersz to jeden wniosek: rodzaj, daty, zakres i stan wykonania.", "uruchamia": "Uruchamia go platforma (wniosek kandydata) albo IOD. On uruchamia właścicieli zbiorów, a po usunięciu danych – Wyliczacza sygnałów o firmach, żeby przeliczył sygnały bez usuniętych zgłoszeń.", "skroty": "RODO – przepisy o ochronie danych osobowych; dają każdemu prawo wglądu w swoje dane i ich usunięcia."}}, {"key": "generator-raportow", "kind": "prog", "name": "Generator raportów publicznych", "sub": "public_reports.py", "fields": [["Działa:", "regularnie robi zestawienia rynku pracy"], ["Analizuje:", "tylko liczby zbiorcze, nigdy pojedyncze osoby"], ["Oddaje:", "public_reports – raporty dla mediów, PIP i badaczy"]], "reads": ["employer_signals", "posting_lifecycles", "published_trust_scores", "badge_view_stats"], "writes": ["public_reports"], "role": {"kim": "Generator raportów publicznych (plik public_reports.py) przygotowuje zestawienia o rynku pracy dla mediów, Państwowej Inspekcji Pracy i badaczy. Używa tylko liczb zbiorczych – nigdy danych o konkretnych kandydatach.", "zadania": ["Regularnie robić zestawienia, np. jaki odsetek ofert w danej branży to ghost joby.", "Na wniosek instytucji przygotować pakiet dowodów o konkretnej firmie (bez danych kandydatów).", "Zapisać każde zestawienie i pakiet w public_reports."], "korzysta": "Czyta employer_signals (sygnały firm), posting_lifecycles (cykle życia ogłoszeń), published_trust_scores (opublikowane wyniki) i badge_view_stats (liczniki wyświetleń odznak).", "zapisuje": "Jest jedynym programem, który zapisuje do public_reports.", "uruchamia": "Uruchamia go Uruchamiacz zadań cyklicznych (regularne zestawienia) albo IOD (pakiet dla instytucji).", "skroty": "PIP – Państwowa Inspekcja Pracy."}}], "stores": [{"key": "appeals", "kind": "store", "name": "appeals", "sub": "odwołania firm", "fields": [["Przechowuje:", "czego dotyczy, rodzaj odwołania, treść, załączniki"], ["Po co:", "firma ma prawo się bronić; to też chroni nas w razie sporu"]]}, {"key": "moderator_decisions", "kind": "store", "name": "moderator_decisions", "sub": "decyzje moderatorów", "fields": [["Przechowuje:", "czego dotyczy, decyzję, uzasadnienie, kto i kiedy"], ["Po co:", "zmienia oceny i wyniki; w przyszłości to etykiety, z których uczy się model"]]}, {"key": "moderation_queue", "kind": "store", "name": "moderation_queue (widok)", "sub": "kolejka moderacji", "fields": [["Przechowuje:", "nic osobno – to zapytanie o wszystko, co czeka na decyzję człowieka"], ["Po co:", "jedno miejsce pracy moderatora"]], "viewOf": ["report_verdicts", "abuse_alerts", "appeals", "published_trust_scores"]}, {"key": "privacy_requests", "kind": "store", "name": "privacy_requests", "sub": "wnioski RODO", "fields": [["Przechowuje:", "rodzaj wniosku, daty, zakres i wykonanie – bez treści danych"], ["Po co:", "dowód, że wniosek wykonaliśmy w terminie"]]}, {"key": "public_reports", "kind": "store", "name": "public_reports", "sub": "raporty publiczne", "fields": [["Przechowuje:", "opublikowane zestawienia i pakiety dowodowe"], ["Po co:", "nacisk na nieuczciwe firmy – to cel całego projektu"]]}]}, {"id": 6, "name": "Zaplecze", "mapTitle": "6. Zaplecze (dla wszystkich)", "storeGroup": "Administracja", "finding": "zaplecze pilnuje porządku – zasad, czasu, kosztów i śladów", "link": "Zbiory zaplecza czytają wszystkie warstwy, a Kontroler kluczy API pilnuje wejścia do każdej z nich.", "band1": "KTO STERUJE ZAPLECZEM", "arrow1": "ustawienia trafiają do programów", "note": "Pomocnicze zbiory: api_access_log (log zapytań), system_alerts (alerty techniczne), llm_usage_log (koszty AI).", "mapSources": [{"kind": "person", "name": "Administrator", "detail": "parametry i słowniki"}], "flowNext": null, "sources": [{"key": "administrator", "kind": "person", "name": "Administrator", "sub": "nasz pracownik techniczny", "fields": [["Daje:", "parametry (progi, wagi, terminy), słowniki, klucze partnerów, konta personelu"]], "talks": ["edytor-ustawien"], "role": {"kim": "Administrator to nasz pracownik techniczny. Ustawia parametry systemu, prowadzi słowniki, podłącza nowe platformy i zakłada konta personelu – wszystko przez Edytora ustawień systemu.", "zadania": ["Ustawiać parametry w system_parameters: progi, wagi, terminy przechowywania danych, limity zapytań i harmonogram.", "Prowadzić słowniki: legal_form_dictionary (formy prawne), seniority_dictionary (poziomy stanowisk), skills_dictionary (umiejętności) i boilerplate_patterns (wzorce stopek).", "Podłączać nowe platformy (partners) i wydawać im klucze API (api_keys).", "Zakładać konta personelu i nadawać role (staff_accounts)."], "korzysta": "Przez Edytora ustawień systemu czyta job_runs (dziennik uruchomień), system_alerts (alerty techniczne), llm_usage_log (koszty AI) i audit_log (dziennik audytu – tylko do odczytu).", "zapisuje": "Sam nic nie zapisuje bezpośrednio. Jego zmiany zapisuje Edytor ustawień systemu w system_parameters, słownikach, partners, api_keys i staff_accounts.", "uruchamia": "Zmiana parametrów działa we wszystkich programach, które je czytają. Każda zmiana trafia do audit_log przez Zapisywacza dziennika audytu.", "skroty": "Klucz API – tajny ciąg znaków, po którym rozpoznajemy partnera."}}], "programs": [{"key": "kontroler-kluczy-api", "kind": "prog", "name": "Kontroler kluczy API (Brama API)", "sub": "api_gateway – przerywana linia na mapie", "fields": [["Działa:", "każde zapytanie z zewnątrz przechodzi najpierw przez niego"], ["Analizuje:", "klucz API partnera, domenę widżetu i liczbę zapytań (limity)"], ["Oddaje:", "wpuszcza albo odrzuca; zapisuje api_access_log"]], "reads": ["partners", "api_keys"], "writes": ["api_access_log"], "role": {"kim": "Kontroler kluczy API (moduł api_gateway) przyjmuje każde zapytanie, które przychodzi do systemu z zewnątrz – od platform i z widżetu – i decyduje, czy je przepuścić. Pozostałe programy nie są dostępne z internetu bezpośrednio, tylko przez niego. Na mapie oznacza go przerywana linia „Brama API”.", "zadania": ["Sprawdzić klucz API platformy (czy jest w api_keys i jest ważny) albo – dla zapytań z widżetu – czy przyszły z domeny zapisanej w partners.", "Pilnować limitów zapytań z system_parameters, żeby nikt nie przeciążył systemu tysiącami zapytań.", "Przekazać zapytanie do właściwego programu albo je odrzucić z kodem błędu.", "Zapisać w api_access_log: kto pytał, kiedy, z jakiego adresu IP, o co i z jakim skutkiem."], "korzysta": "Czyta partners (podłączone platformy i ich domeny) i api_keys (klucze API).", "zapisuje": "Jest jedynym programem, który zapisuje do api_access_log.", "uruchamia": "Uruchamia go każde zapytanie z zewnątrz. Przekazuje je np. Importerowi kont firm, Importerowi ogłoszeń, Importerowi logu aplikacji, Przyjmowaczowi zgłoszeń kandydatów albo Wyświetlaczowi odznak zaufania.", "skroty": "Brama API (API gateway) – jeden punkt wejścia do systemu z zewnątrz. Domena – adres strony, np. pracuj.pl."}}, {"key": "edytor-ustawien", "kind": "prog", "name": "Edytor ustawień systemu", "sub": "admin_panel", "fields": [["Działa:", "strona, w której administrator zmienia ustawienia systemu"], ["Analizuje:", "kto zmienia – każda zmiana trafia do audytu"], ["Oddaje:", "system_parameters, słowniki, partners, api_keys, staff_accounts"]], "reads": ["job_runs", "system_alerts", "llm_usage_log", "audit_log"], "writes": ["system_parameters", "partners", "api_keys", "staff_accounts", "boilerplate_patterns", "legal_form_dictionary", "seniority_dictionary", "skills_dictionary"], "role": {"kim": "Edytor ustawień systemu (moduł admin_panel) to strona internetowa dla administratora. Pozwala zmieniać ustawienia systemu bez zmiany kodu programów i pokazuje, czy system działa poprawnie.", "zadania": ["Pozwolić administratorowi zmieniać: parametry (system_parameters), słowniki, platformy (partners), klucze API (api_keys) i konta personelu (staff_accounts).", "Każdą zmianę przekazać Zapisywaczowi dziennika audytu.", "Pokazać administratorowi stan systemu: uruchomienia programów z job_runs, alerty z system_alerts i koszty AI z llm_usage_log."], "korzysta": "Czyta job_runs (dziennik uruchomień), system_alerts (alerty techniczne), llm_usage_log (koszty AI) i audit_log (dziennik audytu).", "zapisuje": "Jest jedynym programem, który zapisuje do system_parameters, partners, api_keys, staff_accounts i czterech słowników: boilerplate_patterns, legal_form_dictionary, seniority_dictionary, skills_dictionary.", "uruchamia": "Uruchamia go administrator. Zmienione parametry odczytują wszystkie programy, które z nich korzystają."}}, {"key": "uruchamiacz-zadan", "kind": "prog", "name": "Uruchamiacz zadań cyklicznych", "sub": "scheduler", "fields": [["Działa:", "uruchamia programy o ustalonych porach, np. przeliczenie Trust Score co noc"], ["Analizuje:", "harmonogram zapisany w system_parameters"], ["Oddaje:", "job_runs – co, kiedy i z jakim skutkiem się uruchomiło"]], "reads": ["system_parameters"], "writes": ["job_runs"], "role": {"kim": "Uruchamiacz zadań cyklicznych (moduł scheduler) uruchamia inne programy o ustalonych porach, według harmonogramu zapisanego w system_parameters. Sam nie przetwarza danych – tylko uruchamia programy i zapisuje, jak poszło.", "zadania": ["Odczytać harmonogram z system_parameters, np. „Wyliczacz sygnałów o firmach – codziennie o 2:00”.", "O ustalonej porze uruchomić właściwy program, np. Wyliczacza sygnałów o firmach, Wysyłacza przypomnień, Wykrywacza kampanii zgłoszeń, Weryfikatora firm w rejestrach (ponowne sprawdzenia), Grupowacza ogłoszeń w rodziny, Usuwacza przeterminowanych danych albo Twórcę kopii zapasowych.", "Zapisać w job_runs: który program uruchomił, kiedy start, kiedy koniec, ile rekordów przetworzono i czy były błędy."], "korzysta": "Czyta system_parameters (harmonogram).", "zapisuje": "Jest jedynym programem, który zapisuje do job_runs.", "uruchamia": "Działa sam według zegara systemowego. Uruchamia wiele programów z różnych warstw (lista w zadaniach). Z job_runs korzysta Obserwator stanu systemu.", "skroty": "Harmonogram (scheduler) – lista zadań z godzinami ich uruchomienia."}}, {"key": "obserwator-systemu", "kind": "prog", "name": "Obserwator stanu systemu", "sub": "monitoring", "fields": [["Działa:", "pilnuje, czy wszystkie programy działają"], ["Analizuje:", "błędy w job_runs, długość kolejki zleceń, nietypowy ruch w API"], ["Oddaje:", "alerty techniczne dla administratora"]], "reads": ["job_runs", "task_queue", "api_access_log"], "writes": ["system_alerts"], "role": {"kim": "Obserwator stanu systemu (moduł monitoring) sprawdza, czy wszystkie programy działają poprawnie, i zapisuje alert dla administratora, gdy coś jest nie tak.", "zadania": ["Sprawdzać w job_runs, czy programy uruchamiają się i kończą bez błędów.", "Sprawdzać, czy w task_queue nie przybywa niewykonanych zleceń – to znak, że któryś program przestał działać.", "Sprawdzać w api_access_log, czy nie ma nietypowego ruchu, np. nagłego skoku liczby zapytań.", "Zapisać alert w system_alerts."], "korzysta": "Czyta job_runs (dziennik uruchomień), task_queue (kolejka zleceń) i api_access_log (log zapytań do API).", "zapisuje": "Jest jedynym programem, który zapisuje do system_alerts.", "uruchamia": "Uruchamia go Uruchamiacz zadań cyklicznych. Alerty widzi administrator w Edytorze ustawień systemu."}}, {"key": "posrednik-ai", "kind": "prog", "name": "Pośrednik zapytań do AI", "sub": "llm_gateway.py", "fields": [["Działa:", "jedyny program, który łączy się z modelem AI; inne programy pytają przez niego"], ["Analizuje:", "czy ta sama treść była już pytana – wtedy odpowiedź z pamięci, bez opłaty"], ["Oddaje:", "llm_cache i licznik kosztów AI"]], "reads": ["llm_cache", "system_parameters"], "writes": ["llm_cache", "llm_usage_log"], "role": {"kim": "Pośrednik zapytań do AI (plik llm_gateway.py) to jedyny program, który łączy się z zewnętrznym modelem AI. Inne programy wysyłają zapytania do niego, a on sprawdza, czy identyczne zapytanie już było (wtedy oddaje zapamiętaną odpowiedź bez opłaty), pilnuje budżetu i zapisuje koszt każdego zapytania.", "zadania": ["Przyjmować zapytania od Ekstraktora wymagań z ogłoszeń, Zamieniacza ogłoszeń na wektory i Kompletowacza teczek spraw.", "Policzyć skrót treści zapytania i sprawdzić w llm_cache, czy ta sama treść była już wysłana. Jeśli tak – oddać zapisaną odpowiedź.", "Jeśli nie – sprawdzić budżet w system_parameters, wysłać zapytanie do modelu AI, zapisać odpowiedź w llm_cache i jej koszt w llm_usage_log."], "korzysta": "Czyta llm_cache (zapamiętane odpowiedzi) i system_parameters (który model, jaki budżet).", "zapisuje": "Jest jedynym programem, który zapisuje do llm_cache (odpowiedź zapisana pod skrótem treści zapytania) i llm_usage_log (liczba zapytań, tokeny i koszt).", "uruchamia": "Uruchamiają go Ekstraktor wymagań z ogłoszeń, Zamieniacz ogłoszeń na wektory i Kompletowacz teczek spraw. Sam wysyła zapytania do zewnętrznego modelu AI.", "skroty": "Cache – zapisane wcześniejsze wyniki, żeby nie liczyć (i nie płacić) dwa razy za to samo. Token – kawałek tekstu, od którego liczy się opłatę za model AI. LLM – duży model językowy."}}, {"key": "zapisywacz-audytu", "kind": "prog", "name": "Zapisywacz dziennika audytu", "sub": "audit_logger", "fields": [["Działa:", "zapisuje każdą ważną czynność ludzi i programów"], ["Analizuje:", "kto czytał dane osobowe, kto zmienił wynik, parametr albo decyzję"], ["Oddaje:", "audit_log – nikt nie może go edytować"]], "reads": [], "writes": ["audit_log"], "role": {"kim": "Zapisywacz dziennika audytu (moduł audit_logger) zapisuje w audit_log każdą ważną czynność ludzi i programów: kto czytał dane osobowe, kto zmienił wynik, parametr albo decyzję. Wpisów w audit_log nie może zmienić ani usunąć nikt, także administrator.", "zadania": ["Zapisać, kto (człowiek albo program) i kiedy czytał dane osobowe.", "Zapisać każdą zmianę wyniku, parametru albo decyzji: kto, kiedy, co zmienił, wartość przed i po zmianie.", "Dzięki tym wpisom umożliwić udowodnienie, co się działo – wobec RODO i w razie sporu z firmą."], "korzysta": "Nie czyta zbiorów – dostaje informacje o czynnościach od pozostałych programów, m.in. od Edytora ustawień systemu i Zapisywacza decyzji moderatora.", "zapisuje": "Jest jedynym programem, który zapisuje do audit_log. Może tylko dodawać wiersze.", "uruchamia": "Uruchamia go każdy program, który wykonuje ważną czynność. Z audit_log korzystają IOD i administrator.", "skroty": "Audyt – sprawdzenie, czy wszystko działo się zgodnie z zasadami."}}, {"key": "usuwacz-danych", "kind": "prog", "name": "Usuwacz przeterminowanych danych", "sub": "retention_cleaner.py", "fields": [["Działa:", "po terminie przechowywania każe właścicielom zbiorów usunąć stare dane"], ["Analizuje:", "daty w zbiorach i terminy z parametrów"], ["Oddaje:", "zlecenia usunięcia; sam niczego nie kasuje"]], "reads": ["system_parameters"], "writes": [], "role": {"kim": "Usuwacz przeterminowanych danych (plik retention_cleaner.py) pilnuje, żebyśmy nie trzymali danych dłużej, niż pozwalają terminy zapisane w system_parameters (np. skróty urządzeń tylko przez krótki czas). Sam niczego nie usuwa – wysyła zlecenia usunięcia do programów, które są właścicielami zbiorów.", "zadania": ["Odczytać terminy przechowywania z system_parameters.", "Sprawdzić daty w zbiorach i znaleźć dane starsze niż termin.", "Wysłać przez task_queue właścicielom tych zbiorów zlecenia usunięcia albo anonimizacji starych danych."], "korzysta": "Czyta system_parameters (terminy przechowywania) i daty w pozostałych zbiorach.", "zapisuje": "Nic – dane usuwają właściciele zbiorów. Zlecenia dopisuje do task_queue.", "uruchamia": "Uruchamia go Uruchamiacz zadań cyklicznych. On uruchamia właścicieli zbiorów, w których są przeterminowane dane.", "skroty": "Anonimizacja – usunięcie z danych wszystkiego, co pozwala rozpoznać osobę."}}, {"key": "tworca-kopii", "kind": "prog", "name": "Twórca kopii zapasowych", "sub": "backup_job", "fields": [["Działa:", "robi szyfrowane kopie zapasowe bazy"], ["Analizuje:", "datę wygaśnięcia każdej kopii"], ["Oddaje:", "backups – stare kopie same wygasają"]], "reads": [], "writes": ["backups"], "role": {"kim": "Twórca kopii zapasowych (moduł backup_job) regularnie robi zaszyfrowaną kopię całej bazy i zapisuje informację o niej w backups. Każda kopia ma datę wygaśnięcia, po której jest usuwana – żeby dane usunięte na wniosek RODO znikały też z kopii.", "zadania": ["Regularnie robić zaszyfrowaną kopię całej bazy.", "Nadać każdej kopii datę wygaśnięcia (termin z system_parameters) i usuwać kopie po terminie.", "W razie awarii umożliwić administratorowi odtworzenie bazy z kopii."], "korzysta": "Czyta całą bazę – tylko po to, żeby zrobić kopię.", "zapisuje": "Jest jedynym programem, który zapisuje do backups. Jeden wiersz to jedna kopia: data utworzenia, data wygaśnięcia i miejsce przechowywania.", "uruchamia": "Uruchamia go Uruchamiacz zadań cyklicznych.", "skroty": "Kopia zapasowa (backup) – kopia danych do odtworzenia po awarii. Szyfrowanie – zamiana danych na nieczytelne bez klucza."}}], "stores": [{"key": "system_parameters", "kind": "store", "name": "system_parameters", "sub": "parametry systemu", "fields": [["Przechowuje:", "progi i wagi: po ilu dniach cisza = ghosting, próg pewności, terminy, limity"], ["Po co:", "zmiana zasad bez zmiany kodu"]]}, {"key": "slowniki", "kind": "store", "name": "słowniki i wzorce", "sub": "4 tabele: *_dictionary i boilerplate_patterns", "fields": [["Przechowuje:", "synonimy i wzorce, np. „JS” = „JavaScript”, „sp. z o.o.” = „spółka z o.o.”"], ["Po co:", "programy rozumieją to samo, choć firmy piszą różnie"]], "tables": ["boilerplate_patterns", "legal_form_dictionary", "seniority_dictionary", "skills_dictionary"]}, {"key": "partners", "kind": "store", "name": "partners", "sub": "partnerzy – podłączone platformy", "fields": [["Przechowuje:", "platformę, domeny widżetu, wersję formatu, umowę powierzenia danych"], ["Po co:", "Kontroler kluczy API wie, kogo wpuścić, a Importer ogłoszeń – którego adaptera użyć"]]}, {"key": "api_keys", "kind": "store", "name": "api_keys", "sub": "klucze API", "fields": [["Przechowuje:", "skrót klucza, platformę, uprawnienia, ważność"], ["Po co:", "tylko znani partnerzy mogą wysyłać nam dane"]]}, {"key": "staff_accounts", "kind": "store", "name": "staff_accounts", "sub": "konta personelu", "fields": [["Przechowuje:", "konta i role: moderator, analityk, administrator, IOD"], ["Po co:", "każdy widzi tylko to, do czego ma prawo"]]}, {"key": "audit_log", "kind": "store", "name": "audit_log", "sub": "dziennik audytu", "fields": [["Przechowuje:", "kto (człowiek lub program), kiedy, na czym i co zmienił"], ["Po co:", "rozliczalność wobec RODO i dowód w sporze"]]}, {"key": "task_queue", "kind": "store", "name": "task_queue", "sub": "kolejka zleceń", "fields": [["Przechowuje:", "zlecenia między programami: rodzaj, odnośnik do danych, czy zrobione"], ["Po co:", "gdy program nie działa, praca czeka, a nie ginie w pamięci RAM"]], "sharedWrite": "każdy program – tylko własne zlecenia (jedyny wyjątek od zasady jednego właściciela)"}, {"key": "job_runs", "kind": "store", "name": "job_runs", "sub": "dziennik uruchomień", "fields": [["Przechowuje:", "start, koniec, liczbę rekordów i błędy każdego uruchomienia"], ["Po co:", "Obserwator stanu systemu widzi, co się zepsuło i kiedy"]]}, {"key": "llm_cache", "kind": "store", "name": "llm_cache", "sub": "pamięć odpowiedzi AI", "fields": [["Przechowuje:", "odpowiedź AI zapisaną pod skrótem treści"], ["Po co:", "ta sama treść = brak drugiej opłaty"]]}, {"key": "backups", "kind": "store", "name": "backups", "sub": "kopie zapasowe", "fields": [["Przechowuje:", "szyfrowane kopie bazy z datą wygaśnięcia"], ["Po co:", "odtworzenie po awarii; wygasają, żeby usunięte dane znikały też z kopii"]]}]}], "aux": {"employer_merge_log": "historia scaleń firm (warstwa 1)", "raw_postings": "surowa kopia ogłoszeń od platform (warstwa 2)", "posting_texts_clean": "oczyszczony tekst ogłoszeń (warstwa 2)", "posting_vectors": "wektory znaczenia ogłoszeń (warstwa 2)", "employer_boilerplate": "akapity powtarzane przez firmę (warstwa 2)", "consents": "zgody kandydatów (warstwa 3)", "reminders_sent": "wysłane przypomnienia (warstwa 3)", "bot_checks": "wyniki sprawdzenia w Cloudflare (warstwa 3)", "badge_view_stats": "liczniki wyświetleń odznak (warstwa 5)", "api_access_log": "log zapytań do API (warstwa 6)", "system_alerts": "alerty techniczne (warstwa 6)", "llm_usage_log": "koszty wywołań AI (warstwa 6)"}, "alias": {"legal_form_dictionary": "slowniki", "seniority_dictionary": "slowniki", "skills_dictionary": "slowniki", "boilerplate_patterns": "slowniki"}}</script>
<script>
(() => {
  const DATA = JSON.parse(document.getElementById('gjs-data').textContent);
  const KIND_LABEL = {
    person: 'Osoba', sys: 'System spoza nas', prog: 'Nasz program',
    widget: 'Nasz kod w przeglądarce', store: 'Zbiór danych'
  };
  const app = document.getElementById('app');
  const panel = document.getElementById('panel');
  const panelBody = document.getElementById('panel-body');
  const scrim = document.getElementById('scrim');
  const current = { view: 'map', layer: null };
  let lastFocus = null;

  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  const uniq = a => [...new Set(a)];

  // Indeksy: kafelek po kluczu, zbiór po nazwie tabeli, właściciele i czytelnicy zbiorów.
  const items = new Map();
  DATA.layers.forEach(L => ['sources', 'programs', 'stores'].forEach(g => L[g].forEach(it => items.set(it.key, { it, L }))));
  const storeKey = new Map();
  DATA.layers.forEach(L => L.stores.forEach(s => storeKey.set(s.name.replace(' (widok)', ''), s.key)));
  Object.entries(DATA.alias).forEach(([name, key]) => storeKey.set(name, key));
  const writers = new Map(), readers = new Map();
  const add = (m, k, v) => { if (!m.has(k)) m.set(k, []); m.get(k).push(v); };
  DATA.layers.forEach(L => L.programs.forEach(p => {
    p.writes.forEach(d => add(writers, storeKey.get(d) || d, p.key));
    p.reads.forEach(d => add(readers, storeKey.get(d) || d, p.key));
  }));

  const names = [...storeKey.keys(), ...Object.keys(DATA.aux)].sort((a, b) => b.length - a.length);
  // Nazwy programów w opisach bywają odmienione („Weryfikatorowi firm w rejestrach”),
  // więc pierwsze słowo dopasowujemy z dowolną końcówką, a resztę dosłownie.
  const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const progPatterns = [];
  DATA.layers.forEach(L => L.programs.forEach(p => {
    const [head, ...rest] = p.name.replace(/ \(.*\)$/, '').split(' ');
    const src = reEsc(head.replace(/a$/, '')) + '\\p{L}*' + rest.map(w => ' ' + reEsc(w)).join('');
    progPatterns.push({ key: p.key, src, re: new RegExp('^' + src + '$', 'u') });
  }));
  const nameRe = new RegExp('(?<![\\p{L}_])(' + [...names, ...progPatterns.map(p => p.src)].join('|') + ')(?![\\p{L}_])', 'gu');

  function datasetChip(name, inline) {
    const cls = inline ? 'ref' : 'chip';
    const key = storeKey.get(name);
    if (key && items.has(key)) {
      return `<button type="button" class="${cls} k-store" data-open="${esc(key)}">${esc(name)}</button>`;
    }
    const tip = DATA.aux[name] ? `zbiór pomocniczy: ${DATA.aux[name]}` : 'zbiór pomocniczy';
    return `<span class="${cls} k-store is-static" title="${esc(tip)}">${esc(name)}</span>`;
  }
  function programChip(key) {
    const rec = items.get(key);
    return `<button type="button" class="chip k-prog" data-open="${esc(key)}">${esc(rec.it.name)}</button>`;
  }
  function linkify(text) {
    let out = '', last = 0;
    text.replace(nameRe, (m, _g, idx) => {
      const prog = storeKey.has(m) || DATA.aux[m] ? null : progPatterns.find(p => p.re.test(m));
      out += esc(text.slice(last, idx)) + (prog
        ? `<button type="button" class="ref k-prog" data-open="${esc(prog.key)}">${esc(m)}</button>`
        : datasetChip(m, true));
      last = idx + m.length;
      return m;
    });
    return out + esc(text.slice(last));
  }

  function legend(opts) {
    const rows = [['person', 'osoba'], ['sys', 'system spoza nas'], ['prog', 'nasz program'], ['store', 'zbiór danych (przyszła tabela SQL)']];
    if (opts.widget) rows.push(['widget', 'nasz kod w przeglądarce kandydata']);
    let html = rows.map(([k, l]) => `<li><span class="sw k-${k}"></span>${esc(l)}</li>`).join('');
    if (opts.gate) html += '<li><span class="sw-gate"></span>Brama API – każde zapytanie z zewnątrz przechodzi przez Kontrolera kluczy API</li>';
    return `<ul class="legend">${html}</ul>`;
  }

  // Kierunek strzałek źródło ↔ dział (in: do działu, out: do osoby, both: pytanie i odpowiedź).
  const DIRS = { 1: ['in', 'both'], 2: ['in', 'both'], 3: ['both', 'in', 'both'], 4: ['both', 'in'], 5: ['out', 'both', 'both'], 6: ['in'] };

  function mapSvg(hl) {
    const ex = 24, ew = 176, gx = 224, px = 248, pw = 256, sx = 536, sw = 200;
    const cx = px + pw / 2, scx = sx + sw / 2;
    let y = 74;
    const lanes = DATA.layers.map(L => {
      const h = Math.max(L.mapSources.length * 56 - 8, 40 + 16 * L.programs.length, 40 + 16 * L.stores.length);
      const lane = { L, top: y, h };
      y += h + 64;
      return lane;
    });
    const H = y - 64 + 24;
    const gateEnd = lanes[4].top + lanes[4].h + 4;
    let out = `<svg class="svgmap" viewBox="0 0 760 ${H}" role="img" aria-label="Cała struktura: sześć warstw systemu">
      <defs><marker id="m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-head"/></marker></defs>
      <text x="${gx}" y="44" text-anchor="middle" class="t-gate">Brama API</text>
      <line x1="${gx}" y1="52" x2="${gx}" y2="${gateEnd}" class="gate-line"/>`;
    lanes.forEach(({ L, top, h }, i) => {
      const dim = hl && hl !== L.id ? ' dim' : '';
      const cur = hl === L.id ? ' current' : '';
      let g = `<g class="mlane${dim}${cur}" data-nav="warstwa-${L.id}" tabindex="0" role="link" aria-label="Otwórz warstwę ${L.id}: ${esc(L.name)}">
        <rect class="lane-bg" x="12" y="${top - 26}" width="736" height="${h + 36}" rx="12"/>
        <text x="${ex}" y="${top - 9}" class="t-label">WARSTWA ${L.id}</text>
        <text x="736" y="${top - 9}" text-anchor="end" class="t-open">${hl === L.id ? 'jesteś tutaj' : 'Otwórz warstwę →'}</text>`;
      L.mapSources.forEach((s, j) => {
        const ey = top + j * 56, cy = ey + 24, d = (DIRS[L.id] || [])[j] || 'in';
        g += `<rect class="box k-${s.kind}" x="${ex}" y="${ey}" width="${ew}" height="48"/>
          <text x="${ex + 12}" y="${ey + 20}" class="t-name">${esc(s.name)}</text>
          <text x="${ex + 12}" y="${ey + 36}" class="t-dim">${esc(s.detail)}</text>`;
        g += d === 'out'
          ? `<path class="conn" d="M${px} ${cy}H${ex + ew}" marker-end="url(#m-arrow)"/>`
          : `<path class="conn" d="M${ex + ew} ${cy}H${px}" marker-end="url(#m-arrow)"${d === 'both' ? ' marker-start="url(#m-arrow)"' : ''}/>`;
      });
      g += `<rect class="box k-prog" x="${px}" y="${top}" width="${pw}" height="${h}" rx="8"/>
        <text x="${px + 16}" y="${top + 24}" class="t-name">${esc(L.mapTitle)}</text>`;
      L.programs.forEach((p, k) => { g += `<text x="${px + 16}" y="${top + 44 + 16 * k}" class="t-line">${esc(p.name)}</text>`; });
      g += `<rect class="store-fill k-store" x="${sx}" y="${top}" width="${sw}" height="${h}"/>
        <path class="store-edge k-store" d="M${sx + sw} ${top}H${sx}V${top + h}H${sx + sw}"/>
        <text x="${sx + 16}" y="${top + 24}" class="t-name">${esc(L.storeGroup)}</text>`;
      L.stores.forEach((z, k) => { g += `<text x="${sx + 16}" y="${top + 44 + 16 * k}" class="t-line t-mono">${esc(z.name)}</text>`; });
      g += `<path class="conn" d="M${px + pw} ${top + h / 2}H${sx}" marker-end="url(#m-arrow)"/></g>`;
      out += g;
      const next = lanes[i + 1];
      if (next && i < 4) {
        const b = top + h;
        out += `<path class="conn" d="M${scx} ${b}V${b + 26}H${cx}V${next.top}" marker-end="url(#m-arrow)"/>
          <text x="${scx - 10}" y="${b + 21}" text-anchor="end" class="t-dim">${esc(L.flowNext)}</text>`;
      } else if (next) {
        out += `<text x="${ex}" y="${top + h + 28}" class="t-dim">${esc(L.flowNext)}</text>`;
      }
    });
    return out + '</svg>';
  }

  function renderMap() {
    app.innerHTML = `
      <header>
        <p class="eyebrow">Projekt bazy danych · osoby, programy i zbiory</p>
        <h1 id="view-title" tabindex="-1">Ghost-Job Scanner w sześciu warstwach</h1>
        <p class="lede">Każda warstwa zapisuje tylko własne zbiory, a cudze jedynie czyta. Kliknij warstwę, żeby zobaczyć jej kafelki i to, co robi każdy z nich.</p>
        <a class="to-model" href="organizmy.html"><b>Model tabel: organizmy od źródła danych →</b><span>18 osobnych grup tabel relacyjnych – od platformy, jej API i endpointów do Trust Score</span></a>
        ${legend({ gate: true })}
      </header>
      <div class="svgwrap">${mapSvg(null)}</div>`;
  }

  function tile(it) {
    const [lab, txt] = it.fields[0];
    return `<button type="button" class="tile k-${it.kind}" data-open="${esc(it.key)}" aria-haspopup="dialog">
      <span class="tile-name${it.kind === 'store' ? ' mono' : ''}">${esc(it.name)}</span>
      <span class="tile-sub${it.kind === 'prog' ? ' mono' : ''}">${esc(it.sub)}</span>
      <span class="tile-teaser"><b>${esc(lab)}</b> ${esc(txt)}</span>
      <span class="tile-more">Szczegóły</span>
    </button>`;
  }

  function renderLayer(L) {
    const pills = DATA.layers.map(x =>
      `<a class="pill" href="#warstwa-${x.id}" data-nav="warstwa-${x.id}"${x.id === L.id ? ' aria-current="page"' : ''}>${x.id}</a>`).join('');
    const band = (title, list) =>
      `<section class="band"><h2 class="eyebrow">${esc(title)}</h2><div class="grid">${list.map(tile).join('')}</div></section>`;
    app.innerHTML = `
      <nav class="crumbs" aria-label="Nawigacja po warstwach">
        <a class="back" href="#struktura" data-nav="struktura">← Cała struktura</a>
        <span class="pills"><span class="pills-label">Warstwy:</span>${pills}</span>
      </nav>
      <details class="mini" open>
        <summary>Cała struktura – zaznaczona warstwa ${L.id}</summary>
        <div class="svgwrap mini-wrap">${mapSvg(L.id)}</div>
      </details>
      <header>
        <p class="eyebrow">Warstwa ${L.id}</p>
        <h1 id="view-title" tabindex="-1">${esc(L.name)}</h1>
        <p class="lede">${esc(cap(L.finding))}.</p>
        ${legend({ widget: L.sources.some(s => s.kind === 'widget') })}
      </header>
      ${band(L.band1, L.sources)}
      <p class="band-arrow">↓ ${esc(L.arrow1)}</p>
      ${band('Programy warstwy', L.programs)}
      <p class="band-arrow">↓ programy zapisują wyniki w zbiorach</p>
      ${band('Zbiory, które warstwa zapisuje (przyszłe tabele)', L.stores)}
      <p class="note">${linkify(L.note)}</p>
      <p class="note">${linkify(L.link)}</p>`;
  }

  const relRow = (label, html, empty) =>
    `<div class="rel"><span class="rel-label">${esc(label)}</span><span class="rel-chips">${html || `<span class="rel-empty">${esc(empty || '—')}</span>`}</span></div>`;
  const sqlRow = s => `<div class="rel"><span class="rel-label">W SQL</span><code class="sql">${esc(s)}</code></div>`;

  function openDetail(key, opener) {
    const rec = items.get(key);
    if (!rec) return;
    const { it, L } = rec;
    let rels = '';
    if (it.kind === 'prog') {
      rels += relRow('Czyta', it.reads.map(d => datasetChip(d)).join(''), 'nic – dostaje zlecenia albo odpowiedzi innych programów');
      rels += relRow('Zapisuje', it.writes.map(d => datasetChip(d)).join(''), 'nic – wynik oddaje innemu programowi');
      rels += '<p class="hint">W bazie ten program ma własne konto użytkownika z prawem zapisu tylko do swoich zbiorów.</p>';
    } else if (it.kind === 'store') {
      const table = it.name.replace(' (widok)', '');
      if (it.viewOf) {
        rels += relRow('Liczony na żywo z', it.viewOf.map(d => datasetChip(d)).join(''));
        rels += sqlRow(`CREATE VIEW ${table} AS SELECT …`);
      } else {
        rels += relRow('Zapisuje (właściciel)', uniq(writers.get(it.key) || []).map(programChip).join(''), it.sharedWrite);
        rels += sqlRow(it.tables ? it.tables.map(t => `CREATE TABLE ${t} (…);`).join('\n') : `CREATE TABLE ${table} (…);`);
      }
      rels += relRow('Czytają', uniq(readers.get(it.key) || []).map(programChip).join(''), 'żaden program z tej mapy');
    } else {
      rels += relRow('Rozmawia z programami', (it.talks || []).map(programChip).join(''));
    }
    const r = it.role;
    const role = !r ? '' : `
      <section class="role k-${it.kind}" aria-labelledby="role-h">
        <h3 id="role-h">Rola</h3>
        <p class="role-lead">${linkify(r.kim)}</p>
        <h4>Co robi – krok po kroku</h4>
        <ol>${r.zadania.map(z => `<li>${linkify(z)}</li>`).join('')}</ol>
        <h4>Z jakich zbiorów czyta</h4><p>${linkify(r.korzysta)}</p>
        <h4>Do jakich zbiorów zapisuje</h4><p>${linkify(r.zapisuje)}</p>
        <h4>Kto go uruchamia i komu przekazuje pracę</h4><p>${linkify(r.uruchamia)}</p>
        ${r.skroty ? `<h4>Skróty i trudne słowa</h4><p>${linkify(r.skroty)}</p>` : ''}
      </section>`;
    panelBody.innerHTML = `
      <div class="p-head">
        <p class="eyebrow kind-label k-${it.kind}">${esc(KIND_LABEL[it.kind])} · warstwa ${L.id}</p>
        <button type="button" class="close" data-close>Zamknij</button>
      </div>
      <h2 id="p-title" class="p-title${it.kind === 'store' ? ' mono' : ''}">${esc(it.name)}</h2>
      <p class="p-sub${it.kind === 'prog' ? ' mono' : ''}">${esc(it.sub)}</p>
      <dl class="fields k-${it.kind}">${it.fields.map(([lab, txt]) => `<dt>${esc(lab.replace(/:$/, ''))}</dt><dd>${linkify(txt)}</dd>`).join('')}</dl>${role}
      <div class="rels">${rels}</div>`;
    if (panel.hidden) lastFocus = opener || document.activeElement;
    panel.hidden = false;
    scrim.hidden = false;
    document.documentElement.classList.add('locked');
    panel.scrollTop = 0;
    panelBody.querySelector('.close').focus();
  }

  function closeDetail() {
    if (panel.hidden) return;
    panel.hidden = true;
    scrim.hidden = true;
    document.documentElement.classList.remove('locked');
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
    lastFocus = null;
  }

  function parse(token) {
    const m = /^warstwa-(\d)(?:--([a-z0-9_-]+))?$/.exec(token || '');
    const L = m && DATA.layers.find(x => x.id === Number(m[1]));
    if (L) return { view: 'layer', L, detail: m[2] && items.has(m[2]) ? m[2] : null };
    return { view: 'map' };
  }

  function show(state, initial) {
    closeDetail();
    if (state.view === 'layer') {
      renderLayer(state.L);
      current.view = 'layer';
      current.layer = state.L.id;
    } else {
      renderMap();
      current.view = 'map';
      current.layer = null;
    }
    if (!initial) {
      window.scrollTo(0, 0);
      const h = document.getElementById('view-title');
      if (h) h.focus({ preventScroll: true });
    }
    if (state.detail) openDetail(state.detail, null);
  }

  function navigate(token) {
    let viaHash = false;
    try {
      if (location.hash.slice(1) !== token) {
        location.hash = token;
        viaHash = location.hash.slice(1) === token;
      }
    } catch (e) { viaHash = false; }
    if (!viaHash) show(parse(token));
  }

  window.addEventListener('hashchange', () => show(parse(location.hash.slice(1))));

  document.addEventListener('click', e => {
    const nav = e.target.closest('[data-nav]');
    if (nav) { e.preventDefault(); navigate(nav.dataset.nav); return; }
    const op = e.target.closest('[data-open]');
    if (op) {
      const rec = items.get(op.dataset.open);
      if (!rec) return;
      if (current.view === 'layer' && current.layer === rec.L.id) openDetail(rec.it.key, panel.contains(op) ? null : op);
      else navigate(`warstwa-${rec.L.id}--${rec.it.key}`);
      return;
    }
    if (e.target.closest('[data-close]') || e.target === scrim) closeDetail();
  });

  document.addEventListener('keydown', e => {
    const lane = e.target.closest && e.target.closest('.mlane');
    if (lane && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); navigate(lane.dataset.nav); return; }
    if (panel.hidden) return;
    if (e.key === 'Escape') { e.preventDefault(); closeDetail(); return; }
    if (e.key === 'Tab') {
      const f = [...panel.querySelectorAll('button, [href]')];
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  show(parse(location.hash.slice(1)), true);
})();
</script>

</body>
</html>
