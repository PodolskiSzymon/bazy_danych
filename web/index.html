<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapa warstw Ghost-Job Scanner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Układ: jedna kolumna (max 1120 px). Mapa = sześć pasów warstw; widok warstwy = trzy pasma kafelków; szczegóły w panelu z prawej. */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --ink: #16202c;
  --muted: #586476;
  --line: #d5dbe4;
  --person: #1b8655;
  --system: #3a4f74;
  --program: #2461c8;
  --store: #c95c1b;
  --focus: #2461c8;
  --shadow: rgba(16, 24, 40, .14);
  --font-display: "Archivo", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141b; --surface: #161d26; --ink: #e5eaf1; --muted: #9ca8b8; --line: #2c3644;
    --person: #4fc48c; --system: #97acd1; --program: #74a4f6; --store: #f08f50; --focus: #74a4f6;
    --shadow: rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141b; --surface: #161d26; --ink: #e5eaf1; --muted: #9ca8b8; --line: #2c3644;
  --person: #4fc48c; --system: #97acd1; --program: #74a4f6; --store: #f08f50; --focus: #74a4f6;
  --shadow: rgba(0, 0, 0, .55);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
.page {
  max-width: 1120px; margin: 0 auto; padding-block: 28px 72px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main:focus, h1:focus { outline: none; }
.eyebrow { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 {
  font-family: var(--font-display); font-weight: 700; font-size: clamp(28px, 3.6vw, 40px);
  line-height: 1.1; letter-spacing: -0.012em; margin: 6px 0 10px; text-wrap: balance;
}
.lede { margin: 0 0 18px; max-width: 65ch; font-size: 16px; }
.to-model { display: inline-flex; flex-direction: column; gap: 2px; margin: 0 0 18px; padding: 10px 14px; border: 1px solid #a8953f;
  border-radius: 10px; background: color-mix(in srgb, #d9c55a 16%, var(--surface)); color: var(--ink); text-decoration: none; }
.to-model b { color: var(--program); }
.to-model span { font-size: 13.5px; color: var(--muted); }
.to-model:hover { box-shadow: 0 0 0 3px color-mix(in srgb, #a8953f 25%, transparent); }
.mono { font-family: var(--font-mono); }
.k-person { --k: var(--person); }
.k-sys { --k: var(--system); }
.k-prog, .k-widget { --k: var(--program); }
.k-store { --k: var(--store); }

/* legenda */
.legend { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 13.5px; }
.legend li { display: inline-flex; align-items: center; gap: 8px; }
.sw { width: 15px; height: 15px; flex: none; border: 1.5px solid var(--k); background: color-mix(in srgb, var(--k) 12%, var(--surface)); }
.sw.k-prog, .sw.k-widget { border-radius: 4px; }
.sw.k-widget { border-style: dashed; }
.sw.k-store { border-right-color: transparent; }
.sw-gate { width: 2px; height: 18px; flex: none; background-image: linear-gradient(to bottom, var(--muted) 55%, transparent 55%); background-size: 2px 6px; }

/* mapa */
.map { display: grid; margin-top: 24px; }
.lane {
  display: grid; grid-template-columns: minmax(0, 1fr) 28px minmax(0, 1.3fr) 32px minmax(0, 1.15fr);
  align-items: start; row-gap: 10px; padding: 14px 16px 16px;
  border: 1px solid var(--line); border-radius: 14px; background: var(--surface);
  color: inherit; text-decoration: none; transition: border-color .15s, box-shadow .15s;
}
.lane:hover { border-color: var(--program); box-shadow: 0 0 0 3px color-mix(in srgb, var(--program) 16%, transparent); }
.lane:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
.lane-top { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.lane-open { font-size: 13.5px; font-weight: 600; color: var(--program); white-space: nowrap; }
.ents { display: grid; gap: 8px; min-width: 0; }
.ent { display: block; padding: 8px 10px; border: 1.5px solid var(--k); background: color-mix(in srgb, var(--k) 8%, var(--surface)); }
.ent b { display: block; font-weight: 600; }
.ent > span { display: block; font-size: 13px; color: var(--muted); }
.gate {
  align-self: stretch; justify-self: center; width: 2px; opacity: .75;
  background-image: linear-gradient(to bottom, var(--muted) 55%, transparent 55%); background-size: 2px 7px;
}
.dept, .stores { display: block; min-width: 0; padding: 10px 12px; border: 1.5px solid var(--k); background: color-mix(in srgb, var(--k) 8%, var(--surface)); }
.dept { --k: var(--program); border-radius: 10px; }
.stores { --k: var(--store); border-right-color: transparent; }
.dept-title { display: block; font-family: var(--font-display); font-weight: 600; margin-bottom: 4px; }
.list { display: grid; gap: 1px; font-size: 13.5px; }
.list.mono { font-size: 13px; overflow-wrap: anywhere; }
.write { align-self: center; justify-self: center; color: var(--muted); font-size: 18px; }
.flow { margin: 0; padding: 9px 0 9px 18px; font-size: 13.5px; color: var(--muted); }
@media (max-width: 760px) {
  .lane { grid-template-columns: minmax(0, 1fr); }
  .gate { width: 100%; height: 2px; background-image: linear-gradient(to right, var(--muted) 55%, transparent 55%); background-size: 7px 2px; }
  .write { transform: rotate(90deg); }
}

/* widok warstwy */
.crumbs { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px 16px; margin-bottom: 18px; }
.back { color: var(--program); font-weight: 600; text-decoration: none; }
.back:hover { text-decoration: underline; }
.pills { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.pills-label { font-size: 13px; color: var(--muted); margin-right: 2px; }
.pill {
  min-width: 34px; padding: 4px 10px; text-align: center; border: 1px solid var(--line); border-radius: 999px;
  background: var(--surface); color: var(--ink); text-decoration: none; font-variant-numeric: tabular-nums;
}
.pill:hover { border-color: var(--program); }
.pill[aria-current="page"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.band { margin-top: 26px; }
.band > h2 { margin-bottom: 10px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(250px, 100%), 1fr)); gap: 12px; }
.tile {
  display: flex; flex-direction: column; align-items: flex-start; gap: 5px; width: 100%; min-width: 0;
  padding: 14px 16px; text-align: left; border: 1.5px solid var(--k); border-radius: 0;
  background: color-mix(in srgb, var(--k) 7%, var(--surface)); color: var(--ink); font: inherit; cursor: pointer;
  transition: background-color .15s;
}
.tile.k-prog, .tile.k-widget { border-radius: 10px; }
.tile.k-widget { border-style: dashed; }
.tile.k-store { border-right-color: transparent; }
.tile:hover { background: color-mix(in srgb, var(--k) 14%, var(--surface)); }
.tile:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.tile-name { font-weight: 600; font-size: 15.5px; overflow-wrap: anywhere; }
.tile-name.mono { font-weight: 500; font-size: 14.5px; }
.tile-sub { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.tile-sub.mono { font-size: 12.5px; }
.tile-teaser { font-size: 13.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tile-more { margin-top: auto; padding-top: 4px; font-size: 13px; font-weight: 600; color: var(--k); }
.tile-more::after { content: " →"; }
.band-arrow { margin: 14px 0 0; color: var(--muted); font-size: 13.5px; }
.note { margin: 24px 0 0; padding-top: 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13.5px; max-width: 80ch; }
.note + .note { margin-top: 6px; padding-top: 0; border-top: 0; }

/* panel szczegółów */
html.locked { overflow: hidden; }
#scrim { position: fixed; inset: 0; z-index: 20; background: color-mix(in srgb, var(--ink) 30%, transparent); }
#panel {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 21; width: min(460px, 100%); overflow-y: auto;
  background: var(--surface); border-left: 1px solid var(--line); box-shadow: -18px 0 40px var(--shadow);
  padding: calc(18px + env(safe-area-inset-top, 0px)) calc(22px + env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) 22px;
  animation: slide .18s ease-out;
}
@keyframes slide { from { transform: translateX(24px); opacity: .6; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { #panel { animation: none; } .lane, .tile { transition: none; } }
@media (max-width: 520px) { #panel { left: 0; width: 100%; border-left: 0; padding-left: max(18px, env(safe-area-inset-left, 0px)); } }
.p-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.kind-label { color: var(--k); }
.close {
  font: inherit; font-size: 13.5px; font-weight: 600; padding: 6px 12px; border: 1px solid var(--line);
  border-radius: 999px; background: var(--surface); color: var(--ink); cursor: pointer;
}
.close:hover { border-color: var(--ink); }
.close:focus-visible, .chip:focus-visible, .ref:focus-visible, .back:focus-visible, .pill:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.p-title { font-family: var(--font-display); font-size: 26px; line-height: 1.15; margin: 14px 0 4px; overflow-wrap: anywhere; text-wrap: balance; }
.p-title.mono { font-family: var(--font-mono); font-size: 21px; font-weight: 500; }
.p-sub { margin: 0 0 18px; color: var(--muted); overflow-wrap: anywhere; }
.p-sub.mono { font-size: 13.5px; }
.fields { margin: 0; display: grid; gap: 2px; padding: 14px 16px; border: 1.5px solid var(--k); background: color-mix(in srgb, var(--k) 6%, var(--surface)); }
.fields.k-prog, .fields.k-widget { border-radius: 10px; }
.fields.k-widget { border-style: dashed; }
.fields.k-store { border-right-color: transparent; }
.fields dt { margin-top: 10px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--k); }
.fields dt:first-child { margin-top: 0; }
.fields dd { margin: 0; }
.role { margin-top: 20px; padding: 16px 18px; border: 1px solid var(--line); border-left: 4px solid var(--k); border-radius: 0 12px 12px 0; background: var(--surface); }
.role h3 { margin: 0 0 4px; font-family: var(--font-display); font-size: 20px; }
.role h4 { margin: 14px 0 4px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--k); }
.role p { margin: 0; line-height: 1.55; }
.role ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; line-height: 1.5; }
.role .role-lead { font-size: 15.5px; }
.rels { display: grid; gap: 14px; margin-top: 20px; }
.rel { display: grid; gap: 6px; min-width: 0; }
.rel-label { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.rel-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.rel-empty { color: var(--muted); font-size: 13.5px; }
.chip, .ref {
  font: inherit; font-size: 13px; line-height: 1.35; color: var(--ink); border: 1px solid var(--k);
  background: color-mix(in srgb, var(--k) 9%, var(--surface)); cursor: pointer;
}
.chip { padding: 4px 9px; border-radius: 999px; }
.ref { padding: 0 5px; border-radius: 4px; }
.chip.k-store, .ref.k-store { font-family: var(--font-mono); font-size: 12.5px; }
.chip:hover, .ref:hover { background: color-mix(in srgb, var(--k) 18%, var(--surface)); }
.is-static { cursor: help; border-style: dotted; }
.sql { display: block; overflow-x: auto; white-space: pre; padding: 8px 10px; font-family: var(--font-mono); font-size: 12.5px; background: var(--bg); border: 1px solid var(--line); }
.hint { margin: 0; font-size: 13.5px; color: var(--muted); }

/* mapa SVG (cała struktura) */
.svgwrap { margin-top: 22px; overflow-x: auto; }
.svgmap { display: block; width: 100%; min-width: 640px; height: auto; font-family: var(--font-body); }
.mini { margin: 0 0 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 10px 14px; }
.mini summary { cursor: pointer; font-size: 13.5px; font-weight: 600; color: var(--muted); }
.mini-wrap { margin-top: 8px; max-width: 620px; }
.mini-wrap .svgmap { min-width: 0; }
.mlane { cursor: pointer; outline: none; }
.mlane.dim { opacity: .38; }
.mlane.dim:hover, .mlane.dim:focus-visible { opacity: .8; }
.lane-bg { fill: none; pointer-events: all; stroke: var(--line); stroke-width: 1; }
.mlane:hover .lane-bg, .mlane:focus-visible .lane-bg { stroke: var(--program); stroke-width: 2.5; }
.mlane.current .lane-bg { stroke: var(--program); stroke-width: 2.5; fill: color-mix(in srgb, var(--program) 6%, transparent); }
.box { fill: color-mix(in srgb, var(--k) 9%, var(--surface)); stroke: var(--k); stroke-width: 1.25; }
.store-fill { fill: color-mix(in srgb, var(--k) 9%, var(--surface)); }
.store-edge { fill: none; stroke: var(--k); stroke-width: 1.25; }
.conn { fill: none; stroke: var(--muted); stroke-width: 1.25; }
.m-head { fill: var(--muted); }
.gate-line { stroke: var(--muted); stroke-width: 1.25; stroke-dasharray: 4 4; }
.t-name { fill: var(--ink); font-size: 13px; font-weight: 600; }
.t-line { fill: var(--ink); font-size: 11.5px; }
.t-mono { font-family: var(--font-mono); font-size: 11px; }
.t-dim { fill: var(--muted); font-size: 11.5px; }
.t-label { fill: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .08em; }
.t-open { fill: var(--program); font-size: 12px; font-weight: 600; }
.t-gate { fill: var(--ink); font-size: 11.5px; font-weight: 600; }
.mini .t-open { display: none; }
</style>
</head>

ami zapisanymi w api_keys i sprawdza, czy platforma jest na liście partners.", "zapisuje": "Sama nic nie zapisuje. Przesłane dane zapisuje Importer kont firm w zbiorze employer_accounts – jeden wiersz to jedno konto firmy na jednej platformie.", "uruchamia": "Każde przesłane konto uruchamia Importera kont firm (po sprawdzeniu przez Kontrolera kluczy API).", "skroty": "API – sposób, w jaki dwa programy wymieniają dane przez internet: jeden wysyła zapytanie w ustalonym formacie, drugi odpowiada. Klucz API – tajny ciąg znaków, który pełni rolę hasła partnera. NIP – 10-cyfrowy numer podatkowy firmy."}}, {"key": "rejestry", "kind": "sys", "name": "Rejestry publiczne", "sub": "państwowe bazy firm: KRS, VAT, CEIDG, REGON", "fields": [["Bierzemy:", "nazwę urzędową, status firmy, datę rejestracji i rodzaj działalności (PKD)"], ["Jak:", "pytamy po numerze NIP, KRS albo REGON; wynik zapisujemy z datą"]], "talks": ["weryfikator-firm"], "role": {"kim": "Rejestry publiczne to państwowe bazy danych o firmach: KRS, CEIDG, REGON i wykaz podatników VAT (tzw. biała lista). To systemy zewnętrzne – możemy tylko wysłać zapytanie o firmę i odczytać odpowiedź, nie możemy w nich niczego zmieniać.", "zadania": ["Na zapytanie z numerem NIP, KRS albo REGON zwrócić dane firmy: nazwę urzędową, formę prawną, status (aktywna, zawieszona, w likwidacji, wykreślona), datę rejestracji i kody PKD (rodzaj działalności).", "Odpowiedzieć „nie znaleziono”, gdy takiej firmy nie ma. To dla nas ważna informacja, bo fałszywe „firmy” zbierające CV często nie istnieją w rejestrach albo są już wykreślone."], "korzysta": "Nie korzysta z naszych zbiorów. Dostaje od nas tylko numer firmy, o którą pytamy.", "zapisuje": "Sam nic u nas nie zapisuje. Odpowiedź rejestru zapisuje Weryfikator firm w rejestrach w zbiorze registry_snapshots, razem z datą zapytania i nazwą rejestru. Dzięki temu nie pytamy rejestru przy każdym ogłoszeniu – rejestry mają dzienne limity zapytań.", "uruchamia": "Niczego u nas nie uruchamia. Zapytania wysyła do nich zawsze Weryfikator firm w rejestrach.", "skroty": "KRS – Krajowy Rejestr Sądowy (spółki, np. sp. z o.o.). CEIDG – rejestr jednoosobowych działalności gospodarczych. REGON – rejestr GUS z numerem statystycznym firmy. Biała lista VAT – wykaz podatników VAT prowadzony przez Ministerstwo Finansów. PKD – kod opisujący, czym firma się zajmuje."}}], "programs": [{"key": "importer-kont", "kind": "prog", "name": "Importer kont firm", "sub": "import_employer_account.py", "fields": [["Działa:", "odbiera konto firmy przysłane przez platformę"], ["Analizuje:", "czy dane są kompletne i w dobrym formacie"], ["Oddaje:", "wpis w employer_accounts i zlecenie dla Weryfikatora firm w rejestrach"]], "reads": ["partners"], "writes": ["employer_accounts"], "role": {"kim": "Importer kont firm (plik import_employer_account.py) to pierwszy program, do którego trafiają dane konta firmy przesłane przez platformę. Sprawdza, czy dane są kompletne i poprawne, i zapisuje je w zbiorze employer_accounts. Nie ocenia firmy i nie sprawdza jej w rejestrach – robią to kolejne programy.", "zadania": ["Odebrać od platformy (po sprawdzeniu przez Kontrolera kluczy API) dane konta: platformę, identyfikator konta w serwisie, nazwę firmy, NIP i adres strony www.", "Sprawdzić poprawność danych: czy są pola obowiązkowe (platforma, identyfikator konta, nazwa), czy NIP ma 10 cyfr, czy adres strony ma poprawną postać. Błędne dane odrzucić i odesłać platformie komunikat o błędzie.", "Sprawdzić w employer_accounts, czy to konto już istnieje (ta sama platforma i ten sam identyfikator konta). Jeśli nie – dodać nowy wiersz; jeśli tak – zaktualizować zmienione pola.", "Dodać do task_queue zlecenie dla Weryfikatora firm w rejestrach: „sprawdź w rejestrach firmę z tego konta”."], "korzysta": "Czyta partners (lista podłączonych platform), żeby wiedzieć, w jakim formacie i w jakiej wersji formatu dana platforma przysyła dane.", "zapisuje": "Jest jedynym programem, który zapisuje do employer_accounts. Jeden wiersz tego zbioru to jedno konto firmy na jednej platformie: platforma, identyfikator konta, nazwa, NIP (jeśli podany), strona www, data dodania i ostatniej zmiany. Zlecenie dla następnego programu dopisuje do task_queue.", "uruchamia": "Uruchamia go platforma, gdy przesyła konto. On przekazuje pracę Weryfikatorowi firm w rejestrach – przez zlecenie w task_queue.", "skroty": "task_queue – kolejka zleceń: tabela, w której jeden program zapisuje, co ma zrobić inny program. Zlecenie nie ginie, nawet gdy tamten program akurat nie działa – wykona je po uruchomieniu."}}, {"key": "weryfikator-firm", "kind": "prog", "name": "Weryfikator firm w rejestrach", "sub": "verify_company_registry.py", "fields": [["Działa:", "sprawdza sumę kontrolną NIP i pyta rejestry o firmę; co jakiś czas sprawdza ponownie"], ["Analizuje:", "czy firma istnieje, czy działa, od kiedy i czym się zajmuje"], ["Oddaje:", "odpis w registry_snapshots"]], "reads": ["employer_accounts", "system_parameters"], "writes": ["registry_snapshots"], "role": {"kim": "Weryfikator firm w rejestrach (plik verify_company_registry.py) sprawdza w państwowych rejestrach, czy firma z konta na platformie naprawdę istnieje i działa. Wynik każdego sprawdzenia zapisuje w zbiorze registry_snapshots.", "zadania": ["Pobrać zlecenie z task_queue i odczytać z employer_accounts NIP (albo numer KRS lub REGON) firmy.", "Sprawdzić sumę kontrolną NIP. Ostatnia cyfra NIP wynika z dziewięciu poprzednich, więc bez pytania urzędu da się wykryć literówkę albo zmyślony numer.", "Wysłać zapytanie do rejestrów publicznych i odczytać: nazwę urzędową, formę prawną, status, datę rejestracji i kody PKD.", "Zapisać odpowiedź w registry_snapshots razem z datą sprawdzenia i nazwą rejestru – również wtedy, gdy rejestr odpowiedział „nie znaleziono”.", "Co ustaloną liczbę dni (zapisaną w system_parameters) sprawdzić znane firmy ponownie, bo firma mogła np. zostać wykreślona albo zawieszona.", "Dodać do task_queue zlecenie dla Łączyciela kont z platform."], "korzysta": "Czyta employer_accounts (stąd bierze NIP i nazwę firmy do sprawdzenia) oraz system_parameters (co ile dni powtarzać sprawdzenie).", "zapisuje": "Jest jedynym programem, który zapisuje do registry_snapshots. Jeden wiersz to wynik jednego sprawdzenia jednej firmy w jednym rejestrze. Starych wierszy nie nadpisuje – każde nowe sprawdzenie to nowy wiersz, więc widać historię zmian statusu firmy.", "uruchamia": "Uruchamiają go Importer kont firm (nowe albo zmienione konto) i Uruchamiacz zadań cyklicznych (ponowne sprawdzenia). Po zapisaniu wyniku przekazuje pracę Łączycielowi kont z platform.", "skroty": "Suma kontrolna – cyfra wyliczana z pozostałych cyfr numeru; jeśli się nie zgadza, numer jest błędny. KRS, CEIDG, REGON – opisane przy Rejestrach publicznych."}}, {"key": "laczyciel-kont", "kind": "prog", "name": "Łączyciel kont z platform", "sub": "resolve_employer_identity.py", "fields": [["Działa:", "łączy konta z różnych platform w jednego pracodawcę"], ["Analizuje:", "NIP, a bez NIP nazwę i stronę www; rozpoznaje agencje rekrutacyjne"], ["Oddaje:", "employers i employer_account_links; błędne scalenie da się cofnąć"]], "reads": ["employer_accounts", "registry_snapshots", "legal_form_dictionary"], "writes": ["employers", "employer_account_links", "employer_merge_log"], "role": {"kim": "Łączyciel kont z platform (plik resolve_employer_identity.py) ustala, które konta z różnych platform należą do tej samej firmy, i tworzy dla każdej firmy jeden wiersz w zbiorze employers. Przykład: konto „Kowalski sp. z o.o.” na pracuj.pl i konto „KOWALSKI SPÓŁKA Z OGRANICZONĄ ODPOWIEDZIALNOŚCIĄ” na OLX mają ten sam NIP, więc to jedna firma i dostanie jeden Trust Score.", "zadania": ["Dla nowego albo zmienionego konta z employer_accounts poszukać pasującej firmy w employers: najpierw po tym samym NIP, a gdy NIP-u brak – po nazwie (ujednoliconej słownikiem legal_form_dictionary) i adresie strony www.", "Jeśli pasująca firma istnieje – zapisać w employer_account_links, że to konto należy do niej, wraz z pewnością dopasowania (np. 1,0 przy tym samym NIP, mniej przy samej nazwie). Jeśli nie istnieje – dodać nową firmę do employers.", "Na podstawie wyniku z registry_snapshots zapisać w employers typ podmiotu (firma, agencja rekrutacyjna, osoba prywatna) i stan weryfikacji, np. „potwierdzona w KRS”, „brak w rejestrach” albo „nie da się sprawdzić – brak NIP”.", "Rozpoznać agencje rekrutacyjne, które publikują ogłoszenia „dla klienta” bez nazwy firmy – wtedy oceniana jest sama agencja.", "Każde połączenie i rozłączenie kont zapisać w employer_merge_log, żeby błędne połączenie dało się cofnąć."], "korzysta": "Czyta employer_accounts (konta firm), registry_snapshots (wyniki sprawdzeń w rejestrach) i legal_form_dictionary (słownik form prawnych, np. „sp. z o.o.” = „spółka z ograniczoną odpowiedzialnością”).", "zapisuje": "Jest jedynym programem, który zapisuje do trzech zbiorów: employers (jeden wiersz = jedna firma; dla tych wierszy liczony jest Trust Score), employer_account_links (które konto na której platformie należy do której firmy i z jaką pewnością) oraz employer_merge_log (historia połączeń i rozłączeń kont).", "uruchamia": "Uruchamia go Weryfikator firm w rejestrach po zapisaniu nowego wyniku. Ze zbioru employer_account_links korzystają potem Wyszukiwacz podobnych ogłoszeń (warstwa 2) i Wyświetlacz odznak zaufania (warstwa 5), żeby przypisać ogłoszenie do właściwej firmy.", "skroty": "Pewność dopasowania – liczba od 0 do 1; 1 znaczy „na pewno ta sama firma”. Agencja rekrutacyjna – firma, która szuka pracowników dla innej firmy."}}], "stores": [{"key": "employer_accounts", "kind": "store", "name": "employer_accounts", "sub": "konta firm na platformach", "fields": [["Przechowuje:", "platformę, id konta, nazwę, NIP (jeśli podany), stronę www"], ["Po co:", "z tego Łączyciel kont z platform ustala, kto naprawdę stoi za kontem – jedna firma może mieć wiele kont"]]}, {"key": "registry_snapshots", "kind": "store", "name": "registry_snapshots", "sub": "odpisy z rejestrów publicznych", "fields": [["Przechowuje:", "dane z rejestru razem z datą i źródłem sprawdzenia"], ["Po co:", "wykrywa firmy wykreślone i świeże wydmuszki; dzięki niemu nie pytamy rejestru przy każdym ogłoszeniu"]]}, {"key": "employers", "kind": "store", "name": "employers", "sub": "pracodawcy – jeden wiersz = jedna firma", "fields": [["Przechowuje:", "podmiot, typ (firma, agencja, osoba prywatna) i stan weryfikacji"], ["Po co:", "główna tabela: dla każdego wiersza liczymy Trust Score i do niej odwołują się inne zbiory"]]}, {"key": "employer_account_links", "kind": "store", "name": "employer_account_links", "sub": "powiązania kont z firmami", "fields": [["Przechowuje:", "które konto na której platformie należy do której firmy i z jaką pewnością"], ["Po co:", "ogłoszenie z dowolnej platformy trafia do właściwej firmy"]]}]}, {"id": 2, "name": "Dział Ogłoszeń", "mapTitle": "2. Dział Ogłoszeń", "storeGroup": "Ogłoszenia, Cykle życia", "finding": "każde ogłoszenie porównujemy z poprzednimi ogłoszeniami tej firmy", "link": "Rodziny i cykle życia ogłoszeń czyta warstwa 4, a samą ofertę – Przyjmowacz zgłoszeń kandydatów z warstwy 3.", "band1": "SKĄD BIERZEMY DANE", "arrow1": "dane trafiają do programów", "note": "Pomocnicze zbiory: raw_postings (kopia surowa), posting_texts_clean, posting_vectors, słowniki i wzorce stopek.", "mapSources": [{"kind": "sys", "name": "Platformy", "detail": "ogłoszenia i zdarzenia"}, {"kind": "sys", "name": "Model AI", "detail": "cechy i wektory tekstu"}], "flowNext": "warstwa 3 czyta ogłoszenia (job_postings)", "sources": [{"key": "platformy-ogloszenia", "kind": "sys", "name": "Platformy", "sub": "pracuj.pl, OLX", "fields": [["Bierzemy:", "treść ogłoszenia i jego zdarzenia: publikację, edycję, odświeżenie, wygaśnięcie, zamknięcie"], ["Jak:", "ich serwer wysyła je do naszego API; każda platforma ma swój format"]], "talks": ["importer-ogloszen"], "role": {"kim": "Te same platformy co w warstwie 1 (pracuj.pl, OLX), ale tutaj przesyłają nam ogłoszenia o pracę i informacje o tym, co się z nimi dzieje. To system zewnętrzny – nie ma dostępu do naszej bazy.", "zadania": ["Przesłać każde nowe ogłoszenie: identyfikator ogłoszenia w serwisie, identyfikator konta firmy, tytuł, opis, miejsce pracy, rodzaj umowy, widełki płacowe (jeśli są), datę publikacji i datę końca.", "Przesyłać zdarzenia dotyczące ogłoszenia: edycję treści, odświeżenie (przesunięcie na górę listy), wygaśnięcie, wcześniejsze zamknięcie i ponowną publikację – każde z datą."], "korzysta": "Nie czyta naszych zbiorów. Każde wysłanie najpierw sprawdza Kontroler kluczy API.", "zapisuje": "Sama nic nie zapisuje. Dane zapisuje Importer ogłoszeń w trzech zbiorach: raw_postings (dane dokładnie w takiej postaci, w jakiej przyszły), job_postings (ogłoszenie przepisane do naszego wspólnego formatu) i posting_events (lista zdarzeń ogłoszenia z datami).", "uruchamia": "Każde ogłoszenie albo zdarzenie uruchamia Importera ogłoszeń. Potem pracę przejmują po kolei: Czyściciel treści ogłoszeń, Ekstraktor wymagań z ogłoszeń i Zamieniacz ogłoszeń na wektory, Wyszukiwacz podobnych ogłoszeń, a na końcu Grupowacz ogłoszeń w rodziny."}}, {"key": "model-ai", "kind": "sys", "name": "Model AI", "sub": "zewnętrzny model językowy i model wektorów", "fields": [["Bierzemy:", "wymagania wyciągnięte z tekstu i wektory znaczenia (liczby opisujące sens)"], ["Jak:", "zawsze przez Pośrednika zapytań do AI z warstwy 6, który pamięta odpowiedzi"]], "talks": ["posrednik-ai", "ekstraktor-wymagan", "zamieniacz-na-wektory"], "role": {"kim": "Model AI to zewnętrzna usługa sztucznej inteligencji, za której użycie płacimy za każde zapytanie. Korzystamy z dwóch rodzajów modelu: modelu językowego (czyta tekst i odpowiada tekstem) oraz modelu wektorów (zamienia tekst na listę liczb opisującą jego znaczenie).", "zadania": ["Model językowy: z tekstu ogłoszenia wypisać informacje, których nie znalazły proste reguły Ekstraktora wymagań z ogłoszeń, np. poziom stanowiska albo wymagania opisane długim zdaniem.", "Model wektorów: zamienić oczyszczony tekst ogłoszenia na wektor. Dwa ogłoszenia o tym samym znaczeniu dostają podobne wektory, nawet gdy użyto innych słów – dzięki temu Wyszukiwacz podobnych ogłoszeń wykrywa przeredagowane powtórki."], "korzysta": "Dostaje od nas tylko tekst ogłoszenia, bez żadnych danych kandydatów. Nie ma dostępu do naszej bazy.", "zapisuje": "Sam nic u nas nie zapisuje. Jego odpowiedzi zapisują nasze programy: Ekstraktor wymagań z ogłoszeń w posting_features, Zamieniacz ogłoszeń na wektory w posting_vectors, a Pośrednik zapytań do AI dodatkowo w llm_cache (zapamiętane odpowiedzi) i llm_usage_log (koszt każdego zapytania).", "uruchamia": "Niczego nie uruchamia. Zapytania wysyła do niego wyłącznie Pośrednik zapytań do AI – w imieniu Ekstraktora wymagań z ogłoszeń i Zamieniacza ogłoszeń na wektory.", "skroty": "AI – sztuczna inteligencja. LLM – duży model językowy, czyli program, który czyta i pisze tekst. Wektor – lista liczb; teksty o podobnym znaczeniu dają podobne liczby."}}], "programs": [{"key": "importer-ogloszen", "kind": "prog", "name": "Importer ogłoszeń", "sub": "import_job_posting.py + adaptery platform", "fields": [["Działa:", "odbiera ogłoszenie; adapter danej platformy przepisuje jej format na nasz wspólny"], ["Analizuje:", "czy to nowe ogłoszenie, czy zmiana już znanego"], ["Oddaje:", "job_postings, posting_events i surową kopię raw_postings"]], "reads": ["partners"], "writes": ["raw_postings", "job_postings", "posting_events"], "role": {"kim": "Importer ogłoszeń (plik import_job_posting.py) odbiera od platform ogłoszenia i zdarzenia ogłoszeń, przepisuje je do jednego wspólnego formatu i zapisuje. Każda platforma przysyła dane w innym układzie pól, dlatego dla każdej platformy jest osobny adapter, np. adapter_pracuj.py i adapter_olx.py.", "zadania": ["Odebrać ogłoszenie albo zdarzenie (po sprawdzeniu przez Kontrolera kluczy API).", "Zapisać przesłane dane bez żadnych zmian w raw_postings – gdyby adapter miał błąd, da się je przetworzyć ponownie.", "Adapterem danej platformy przepisać dane na nasz format, np. pole z dolną granicą wynagrodzenia z OLX i z pracuj.pl trafia do jednego wspólnego pola „widełki od”.", "Sprawdzić w job_postings, czy to nowe ogłoszenie (nieznany identyfikator), czy zmiana znanego. Nowe dodać, znane zaktualizować.", "Dopisać zdarzenie do posting_events, np. „opublikowano 2026-10-23” albo „odświeżono 2026-11-02”. Zdarzeń nigdy nie usuwa ani nie zmienia.", "Dodać do task_queue zlecenie dla Czyściciela treści ogłoszeń."], "korzysta": "Czyta partners (lista platform i wersja ich formatu danych), żeby wybrać właściwy adapter.", "zapisuje": "Jest jedynym programem, który zapisuje do raw_postings (dane w postaci przysłanej przez platformę), job_postings (ogłoszenia w naszym formacie: tytuł, opis, konto firmy, miejsce, umowa, daty, stan) i posting_events (zdarzenia ogłoszeń z datami).", "uruchamia": "Uruchamia go platforma. Po zapisaniu przekazuje pracę Czyścicielowi treści ogłoszeń przez task_queue. Jeśli ogłoszenie przyszło z konta firmy, którego jeszcze nie znamy, konto przechodzi też przez warstwę 1 (Importer kont firm).", "skroty": "Adapter – mały program, który przepisuje dane z formatu jednej platformy na nasz format."}}, {"key": "czysciciel-tresci", "kind": "prog", "name": "Czyściciel treści ogłoszeń", "sub": "clean_posting_text.py", "fields": [["Działa:", "usuwa HTML, stopki „O nas” i klauzule RODO"], ["Analizuje:", "akapity, które firma powtarza w każdym ogłoszeniu; czy prosi o zgodę na przyszłe rekrutacje"], ["Oddaje:", "czysty tekst gotowy do porównań"]], "reads": ["job_postings", "boilerplate_patterns", "employer_boilerplate"], "writes": ["posting_texts_clean", "employer_boilerplate"], "role": {"kim": "Czyściciel treści ogłoszeń (plik clean_posting_text.py) przygotowuje tekst ogłoszenia do porównywania: usuwa z niego wszystko, co nie opisuje samego stanowiska. Bez tego dwa różne ogłoszenia tej samej firmy wyglądałyby na podobne tylko dlatego, że mają tę samą stopkę „O nas” i tę samą klauzulę RODO.", "zadania": ["Pobrać tytuł i opis ogłoszenia z job_postings.", "Usunąć znaczniki HTML, czyli kod formatowania strony (np. pogrubienia i podziały linii).", "Wyciąć typowe stopki i klauzule zgody na przetwarzanie danych – według wzorców z boilerplate_patterns, które wpisuje administrator.", "Wyszukać akapity, które ta konkretna firma powtarza we wszystkich swoich ogłoszeniach, zapisać je w employer_boilerplate i pomijać w kolejnych ogłoszeniach tej firmy.", "Zaznaczyć, czy ogłoszenie prosi o zgodę na wykorzystanie CV w przyszłych rekrutacjach – to częsty sygnał zbierania CV na zapas.", "Zapisać oczyszczony tekst w posting_texts_clean i dodać do task_queue zlecenia dla Ekstraktora wymagań z ogłoszeń i Zamieniacza ogłoszeń na wektory."], "korzysta": "Czyta job_postings (ogłoszenia), boilerplate_patterns (wzorce typowych stopek i klauzul) i employer_boilerplate (akapity powtarzane przez konkretną firmę).", "zapisuje": "Jest jedynym programem, który zapisuje do posting_texts_clean (oczyszczony tekst każdego ogłoszenia) i employer_boilerplate (akapity powtarzane przez daną firmę).", "uruchamia": "Uruchamia go Importer ogłoszeń. Przekazuje pracę Ekstraktorowi wymagań z ogłoszeń i Zamieniaczowi ogłoszeń na wektory.", "skroty": "HTML – język, w którym zapisuje się strony internetowe. Stopka – stały tekst na końcu ogłoszenia, np. opis firmy. Klauzula RODO – formułka o przetwarzaniu danych osobowych."}}, {"key": "ekstraktor-wymagan", "kind": "prog", "name": "Ekstraktor wymagań z ogłoszeń", "sub": "extract_posting_features.py", "fields": [["Działa:", "najpierw reguły (np. widełki „8000–10000 zł”), potem AI dla reszty"], ["Analizuje:", "poziom, wymagania, obowiązki, widełki, rodzaj umowy, pracę zdalną"], ["Oddaje:", "posting_features"]], "reads": ["posting_texts_clean", "seniority_dictionary", "skills_dictionary"], "writes": ["posting_features"], "role": {"kim": "Ekstraktor wymagań z ogłoszeń (plik extract_posting_features.py) czyta oczyszczony tekst ogłoszenia i zapisuje z niego konkretne informacje w osobnych polach: poziom stanowiska, wymagania, obowiązki, widełki płacowe, rodzaj umowy i tryb pracy (stacjonarna, zdalna, hybrydowa). Dzięki temu ogłoszenia da się porównywać pole po polu.", "zadania": ["Pobrać oczyszczony tekst z posting_texts_clean.", "Najpierw użyć prostych reguł – są darmowe i pewne – np. znaleźć zapis widełek „8000–10000 zł brutto” albo słowa „umowa o pracę”.", "Tylko dla informacji, których reguły nie znalazły, wysłać zapytanie do modelu AI przez Pośrednika zapytań do AI.", "Ujednolicić zapisy według słowników: skills_dictionary (np. „JS” i „JavaScript” to ta sama umiejętność) i seniority_dictionary (np. „starszy specjalista” to poziom Senior).", "Zapisać wynik w posting_features."], "korzysta": "Czyta posting_texts_clean (oczyszczony tekst), seniority_dictionary (słownik poziomów: stażysta, junior, mid, senior) i skills_dictionary (słownik umiejętności i ich synonimów).", "zapisuje": "Jest jedynym programem, który zapisuje do posting_features. Jeden wiersz to cechy jednego ogłoszenia: poziom, lista wymagań, lista obowiązków, widełki od–do z walutą, rodzaj umowy i tryb pracy.", "uruchamia": "Uruchamia go Czyściciel treści ogłoszeń. Z modelem AI łączy się wyłącznie przez Pośrednika zapytań do AI. Z posting_features korzystają Wyszukiwacz podobnych ogłoszeń (np. wykrywa ten sam etat ogłoszony raz jako Senior, raz jako Mid) i Wyliczacz sygnałów o firmach (np. czy firma podaje widełki).", "skroty": "Junior / Mid / Senior – poziomy doświadczenia: początkujący, samodzielny, doświadczony. Widełki – przedział wynagrodzenia, np. 8000–10000 zł."}}, {"key": "zamieniacz-na-wektory", "kind": "prog", "name": "Zamieniacz ogłoszeń na wektory", "sub": "embed_posting.py", "fields": [["Działa:", "zamienia tekst na wektor – listę liczb opisującą sens, a nie dokładne słowa"], ["Analizuje:", "znaczenie całego ogłoszenia"], ["Oddaje:", "wektor do szukania podobnych ogłoszeń (posting_vectors)"]], "reads": ["posting_texts_clean"], "writes": ["posting_vectors"], "role": {"kim": "Zamieniacz ogłoszeń na wektory (plik embed_posting.py) zamienia oczyszczony tekst ogłoszenia na wektor, czyli listę kilkuset liczb opisujących znaczenie tekstu. Dwa ogłoszenia, które mówią to samo innymi słowami albo w innej kolejności zdań, dostają bardzo podobne wektory. Porównanie słowo po słowie by tego nie wykryło.", "zadania": ["Pobrać oczyszczony tekst ogłoszenia z posting_texts_clean.", "Wysłać tekst przez Pośrednika zapytań do AI do modelu wektorów i odebrać wektor.", "Zapisać wektor w posting_vectors razem z nazwą i wersją modelu – wektory policzone różnymi wersjami modelu nie nadają się do porównania.", "Dodać do task_queue zlecenie dla Wyszukiwacza podobnych ogłoszeń."], "korzysta": "Czyta posting_texts_clean (oczyszczony tekst ogłoszeń).", "zapisuje": "Jest jedynym programem, który zapisuje do posting_vectors. Jeden wiersz to wektor jednego ogłoszenia i wersja modelu, który go policzył.", "uruchamia": "Uruchamia go Czyściciel treści ogłoszeń. Z modelem AI łączy się przez Pośrednika zapytań do AI. Po pracy przekazuje zlecenie Wyszukiwaczowi podobnych ogłoszeń.", "skroty": "Wektor – lista liczb. Podobieństwo dwóch wektorów liczy się wzorem matematycznym; wynik bliski 1 oznacza prawie ten sam sens tekstu."}}, {"key": "wyszukiwacz-podobnych", "kind": "prog", "name": "Wyszukiwacz podobnych ogłoszeń", "sub": "find_similar_postings.py", "fields": [["Działa:", "porównuje ogłoszenie z poprzednimi ogłoszeniami tej samej firmy"], ["Analizuje:", "kopię, parafrazę, ten sam etat jako Senior i Mid, duplikat na innej platformie"], ["Oddaje:", "similar_posting_pairs"]], "reads": ["posting_vectors", "posting_features", "job_postings", "employer_account_links", "system_parameters"], "writes": ["similar_posting_pairs"], "role": {"kim": "Wyszukiwacz podobnych ogłoszeń (plik find_similar_postings.py) porównuje nowe ogłoszenie z wcześniejszymi ogłoszeniami tej samej firmy i zapisuje pary, które są do siebie podobne. To podstawa wykrywania ghost jobs: firma, która nikogo nie zatrudnia, publikuje to samo ogłoszenie wiele razy, często lekko zmienione.", "zadania": ["Ustalić firmę, do której należy ogłoszenie: konto firmy z job_postings, a potem firma przypisana do tego konta w employer_account_links (zbiór z warstwy 1).", "Wybrać do porównania tylko ogłoszenia tej samej firmy i jej agencji. Podobny szablon dwóch różnych firm nie jest powtórką.", "Porównać wektory (posting_vectors) i cechy (posting_features) ogłoszeń i policzyć podobieństwo od 0 do 1.", "Jeśli podobieństwo przekracza próg z system_parameters, zapisać parę w similar_posting_pairs razem z rodzajem podobieństwa: dokładna kopia, przeredagowany tekst, ten sam etat z innym poziomem (np. Senior i Mid) albo to samo ogłoszenie na innej platformie.", "Przy każdej parze zapisać wersję algorytmu, żeby po jego poprawieniu dało się przeliczyć wszystkie pary.", "Dodać do task_queue zlecenie dla Grupowacza ogłoszeń w rodziny."], "korzysta": "Czyta posting_vectors (wektory), posting_features (cechy), job_postings (ogłoszenia), employer_account_links (które konto należy do której firmy – z warstwy 1) i system_parameters (próg, od którego ogłoszenia uznaje się za podobne).", "zapisuje": "Jest jedynym programem, który zapisuje do similar_posting_pairs. Jeden wiersz to para ogłoszeń: oba identyfikatory, stopień podobieństwa, rodzaj podobieństwa i wersja algorytmu.", "uruchamia": "Uruchamia go Zamieniacz ogłoszeń na wektory. Przekazuje pracę Grupowaczowi ogłoszeń w rodziny. Z similar_posting_pairs korzystają też Kompletowacz teczek spraw i Zapisywacz decyzji moderatora (moderator ogląda pary podobnych ogłoszeń).", "skroty": "Ghost job – ogłoszenie o pracę, za którym nie stoi prawdziwa rekrutacja; firma publikuje je np. po to, żeby zbierać CV. Próg – wartość graniczna zapisana w system_parameters."}}, {"key": "grupowacz-ogloszen", "kind": "prog", "name": "Grupowacz ogłoszeń w rodziny", "sub": "build_posting_families.py", "fields": [["Działa:", "łączy podobne ogłoszenia w rodziny – to samo stanowisko w czasie"], ["Analizuje:", "ile razy ogłoszenie wracało, ile dni było widoczne, przerwy, odświeżenia, warianty poziomu"], ["Oddaje:", "posting_families i posting_lifecycles"]], "reads": ["similar_posting_pairs", "posting_events", "job_postings"], "writes": ["posting_families", "posting_lifecycles"], "role": {"kim": "Grupowacz ogłoszeń w rodziny (plik build_posting_families.py) łączy podobne ogłoszenia jednej firmy w rodziny. Rodzina ogłoszeń to wszystkie wersje tego samego stanowiska w czasie – np. „Księgowa, Kraków” opublikowana 6 razy w ciągu roku. Dla każdej rodziny liczy jej historię, czyli cykl życia.", "zadania": ["Na podstawie par z similar_posting_pairs połączyć ogłoszenia w rodziny: jeśli A jest podobne do B, a B do C, to A, B i C należą do jednej rodziny.", "Dla każdej rodziny policzyć z posting_events i job_postings: liczbę publikacji, łączną liczbę dni widoczności, przerwy między publikacjami, liczbę odświeżeń, różne poziomy stanowiska i platformy.", "Uznać ogłoszenie za wygasłe, gdy minęła jego data końca, a platforma nie przysłała żadnego zdarzenia.", "Zapisać przynależność ogłoszeń do rodzin w posting_families, a policzone liczby w posting_lifecycles."], "korzysta": "Czyta similar_posting_pairs (pary podobnych ogłoszeń), posting_events (zdarzenia ogłoszeń z datami) i job_postings (ogłoszenia).", "zapisuje": "Jest jedynym programem, który zapisuje do posting_families (które ogłoszenie należy do której rodziny) i posting_lifecycles (jeden wiersz = liczby opisujące jedną rodzinę).", "uruchamia": "Uruchamiają go Wyszukiwacz podobnych ogłoszeń (nowa para) i Uruchamiacz zadań cyklicznych (codzienne sprawdzenie wygasłych ogłoszeń). Z jego zbiorów korzystają Wyliczacz sygnałów o firmach (warstwa 4) i Wyświetlacz odznak zaufania (warstwa 5), który pokazuje kandydatowi np. „to ogłoszenie publikowane jest 6. raz”.", "skroty": "Cykl życia – historia rodziny ogłoszeń: kiedy ogłoszenia były widoczne, kiedy znikały i kiedy wracały."}}], "stores": [{"key": "job_postings", "kind": "store", "name": "job_postings", "sub": "ogłoszenia w naszym formacie", "fields": [["Przechowuje:", "tytuł, opis, firmę, miejsce, umowę, daty publikacji i wygaśnięcia, stan"], ["Po co:", "dowód, co i kiedy firma opublikowała; z tego korzystają wszystkie kolejne warstwy"]]}, {"key": "posting_events", "kind": "store", "name": "posting_events", "sub": "dziennik zdarzeń ogłoszeń", "fields": [["Przechowuje:", "opublikowano, edytowano, odświeżono, wygasło, zamknięto, wznowiono – każde z datą"], ["Po co:", "oś czasu ogłoszenia; tylko dopisujemy, nic nie nadpisujemy, więc to dobry dowód"]]}, {"key": "posting_features", "kind": "store", "name": "posting_features", "sub": "cechy ogłoszeń", "fields": [["Przechowuje:", "poziom, wymagania, obowiązki, widełki z walutą, umowę, pracę zdalną"], ["Po co:", "wykrywa „ten sam etat jako Senior i Mid” i firmy, które nigdy nie podają widełek"]]}, {"key": "similar_posting_pairs", "kind": "store", "name": "similar_posting_pairs", "sub": "pary podobnych ogłoszeń", "fields": [["Przechowuje:", "dwa ogłoszenia, stopień podobieństwa, rodzaj relacji i wersję algorytmu"], ["Po co:", "twardy dowód powtórek; po poprawce algorytmu wszystko można przeliczyć"]]}, {"key": "posting_families", "kind": "store", "name": "posting_families", "sub": "rodziny ogłoszeń", "fields": [["Przechowuje:", "wszystkie wersje jednego stanowiska jednej firmy"], ["Po co:", "zamiast wielu osobnych ogłoszeń widać jedno stanowisko publikowane wiele razy"]]}, {"key": "posting_lifecycles", "kind": "store", "name": "posting_lifecycles", "sub": "cykle życia rodzin ogłoszeń", "fields": [["Przechowuje:", "liczbę publikacji, dni widoczności, przerwy, odświeżenia, warianty, platformy"], ["Po co:", "główny sygnał „ghost joba” dla Trust Score i fakt na odznace: „publikowane 6. raz”"]]}]}, {"id": 3, "name": "Dział Zgłoszeń", "mapTitle": "3. Dział Zgłoszeń", "storeGroup": "Aplikacje, Zgłoszenia", "finding": "zgłoszenie kandydata liczy się dopiero po czterech sprawdzeniach", "link": "Do Trust Score w warstwie 4 trafiają tylko zgłoszenia z widoku validated_reports.", "band1": "SKĄD BIERZEMY DANE", "arrow1": "dane trafiają do programów", "note": "Pomocnicze zbiory: consents (zgody), reminders_sent (wysłane przypomnienia), bot_checks (wyniki z Cloudflare).", "mapSources": [{"kind": "person", "name": "Kandydat", "detail": "zgłoszenie w widżecie"}, {"kind": "sys", "name": "Platformy", "detail": "log aplikacji"}, {"kind": "sys", "name": "Cloudflare", "detail": "człowiek czy bot?"}], "flowNext": "warstwa 4 czyta zbiory warstw 1–3", "sources": [{"key": "kandydat", "kind": "person", "name": "Kandydat", "sub": "osoba szukająca pracy na pracuj.pl lub OLX", "fields": [["Daje:", "zgłoszenie wyniku rekrutacji (cisza, odmowa, rozmowa, zatrudnienie) i zgody"], ["Znamy:", "tylko pseudonim od platformy – nie imię, e-mail ani CV"]], "talks": ["przyjmowacz-zgloszen", "rejestrator-zgod"], "role": {"kim": "Kandydat to osoba szukająca pracy, która wysłała aplikację na ogłoszenie na pracuj.pl albo OLX. Dla systemu jest źródłem informacji o tym, co stało się po aplikacji. Nie znamy jej imienia, nazwiska, e-maila ani CV – tylko pseudonim, czyli identyfikator nadany przez platformę.", "zadania": ["Zgłosić wynik rekrutacji przez formularz w widżecie: cisza (firma nie odpowiedziała), automatyczna odmowa, odmowa po rozmowie, oferta wycofana albo zatrudnienie.", "Wyrazić albo wycofać zgodę na przypomnienia i na zbieranie cech urządzenia.", "Odpowiedzieć na przypomnienie z pytaniem, czy firma się odezwała."], "korzysta": "Nie ma dostępu do bazy. Widzi tylko widżet na stronie platformy.", "zapisuje": "Sam nic nie zapisuje. Zgłoszenie zapisuje Przyjmowacz zgłoszeń kandydatów w reports, a zgody – Rejestrator zgód kandydatów w consents.", "uruchamia": "Wysłanie zgłoszenia uruchamia Przyjmowacza zgłoszeń kandydatów, a ten uruchamia sprawdzanie zgłoszenia przez Odsiewacza botów, Porównywacza odcisków urządzeń i Oceniacza wiarygodności zgłoszeń.", "skroty": "Pseudonim – zastępczy identyfikator osoby (ciąg znaków), z którego nie da się odczytać, kim ona jest. Tożsamość zna tylko platforma."}}, {"key": "widzet", "kind": "widget", "name": "Widżet – nasz kod u partnera", "sub": "działa w przeglądarce kandydata, nie u nas", "fields": [["Co to:", "nasz kod JavaScript na stronie pracuj.pl/OLX, np. przycisk „Zgłoś wynik rekrutacji” i formularz"], ["Pliki:", "report_form.js (formularz), device_signals.js (cechy urządzenia), consent_prompt.js (zgody)"], ["Uwaga:", "każdy może go podrobić, dlatego wszystko, co przyśle, sprawdzamy"]], "talks": ["przyjmowacz-zgloszen", "rejestrator-zgod", "porownywacz-odciskow"], "role": {"kim": "Widżet to nasz kod JavaScript osadzony na stronach pracuj.pl i OLX. Działa w przeglądarce kandydata, a nie na naszym serwerze. Wyświetla przycisk „Zgłoś wynik rekrutacji”, formularz zgłoszenia, prośbę o zgody i odznakę przy ofercie. Ponieważ działa na komputerze kandydata, ktoś może go podrobić i wysłać nam zmyślone dane – dlatego wszystko, co przysyła, sprawdzamy.", "zadania": ["Pokazać kandydatowi formularz zgłoszenia (plik report_form.js).", "Za zgodą kandydata zebrać cechy urządzenia, np. model karty graficznej, rozdzielczość ekranu, strefę czasową (plik device_signals.js).", "Zapytać o zgodę na przypomnienia i na zbieranie cech urządzenia (plik consent_prompt.js).", "Pobrać od Cloudflare token potwierdzający, że formularz wypełnia człowiek, i dołączyć go do zgłoszenia.", "Pokazać odznakę przy ofercie (plik trust_badge.js, warstwa 5)."], "korzysta": "Nie czyta naszych zbiorów i niczego trwale nie przechowuje – dane formularza trzyma w pamięci przeglądarki tylko do chwili wysłania.", "zapisuje": "Sam nic nie zapisuje. Wysyła dane do naszych programów: zgłoszenie z tokenem Cloudflare do Przyjmowacza zgłoszeń kandydatów, cechy urządzenia do Porównywacza odcisków urządzeń, a zgody do Rejestratora zgód kandydatów.", "uruchamia": "Wysłanie formularza uruchamia Przyjmowacza zgłoszeń kandydatów i Rejestratora zgód kandydatów. Każde zapytanie widżetu najpierw sprawdza Kontroler kluczy API.", "skroty": "Przeglądarka – program do oglądania stron, np. Chrome. JavaScript – język programów działających na stronach internetowych. Token – jednorazowy kod od Cloudflare, ważny 300 sekund."}}, {"key": "platformy-log", "kind": "sys", "name": "Platformy", "sub": "pracuj.pl, OLX", "fields": [["Bierzemy:", "log aplikacji – kto (pseudonim) aplikował na którą ofertę i kiedy"], ["Po co:", "najmocniejszy dowód, że zgłaszający naprawdę aplikował"]], "talks": ["importer-logu-aplikacji", "wysylacz-przypomnien"], "role": {"kim": "Te same platformy (pracuj.pl, OLX), ale tutaj przesyłają nam log aplikacji – informację, kto (pod pseudonimem) i kiedy aplikował na które ogłoszenie. To potwierdza, że osoba, która wysyła zgłoszenie, naprawdę aplikowała. Log nie mówi nic o przebiegu rekrutacji.", "zadania": ["Przesłać każdą aplikację: pseudonim kandydata, identyfikator ogłoszenia, datę i godzinę aplikacji.", "Jeśli platforma ma własny system rekrutacyjny – przesłać też zmiany statusu aplikacji, np. „odrzucono” albo „zaproszono na rozmowę”.", "Na prośbę Wysyłacza przypomnień wysłać kandydatowi e-mail z pytaniem, czy firma się odezwała (adres e-mail kandydata zna tylko platforma)."], "korzysta": "Nie czyta naszych zbiorów.", "zapisuje": "Sama nic nie zapisuje. Dane zapisuje Importer logu aplikacji w application_log.", "uruchamia": "Każda przesłana aplikacja uruchamia Importera logu aplikacji. Prośby o wysłanie przypomnień przysyła platformie Wysyłacz przypomnień.", "skroty": "Log – lista zdarzeń w kolejności czasu: kto, co i kiedy."}}, {"key": "cloudflare", "kind": "sys", "name": "Cloudflare Turnstile", "sub": "usługa odróżniająca ludzi od botów", "fields": [["Bierzemy:", "odpowiedź tak/nie dla tokenu z przeglądarki; token żyje 300 s i działa raz"], ["Nie dostaje:", "żadnych danych o karcie graficznej ani urządzeniu"]], "talks": ["odsiewacz-botow"], "role": {"kim": "Cloudflare Turnstile to zewnętrzna usługa firmy Cloudflare, która sprawdza, czy formularz wypełnia człowiek, czy bot. Gdy kandydat otwiera formularz w widżecie, Turnstile sprawdza przeglądarkę i wydaje token. Nasz Odsiewacz botów odsyła ten token do Cloudflare i dostaje odpowiedź, czy token jest prawdziwy.", "zadania": ["W przeglądarce kandydata sprawdzić, czy to człowiek, i wydać token (ważny 300 sekund, do jednorazowego użycia).", "Na zapytanie Odsiewacza botów odpowiedzieć: token ważny albo nieważny – z kodem błędu, np. „token wygasł” albo „token już użyty”."], "korzysta": "Dostaje od nas tylko token, nasz tajny klucz Cloudflare i ewentualnie adres IP. Nie dostaje żadnych danych o karcie graficznej ani urządzeniu – swoje sprawdzenia robi sam w przeglądarce.", "zapisuje": "Sam nic u nas nie zapisuje. Jego odpowiedź zapisuje Odsiewacz botów w bot_checks.", "uruchamia": "Niczego u nas nie uruchamia. Zapytania wysyła do niego Odsiewacz botów.", "skroty": "Bot – program udający człowieka. IP – adres komputera w internecie."}}], "programs": [{"key": "przyjmowacz-zgloszen", "kind": "prog", "name": "Przyjmowacz zgłoszeń kandydatów", "sub": "receive_report.py", "fields": [["Działa:", "przyjmuje zgłoszenie z widżetu i od razu je zapisuje – nic nie ginie"], ["Analizuje:", "format i to, czy oferta istnieje"], ["Oddaje:", "reports oraz zlecenie oceny dla Oceniacza wiarygodności zgłoszeń"]], "reads": ["job_postings"], "writes": ["reports"], "role": {"kim": "Przyjmowacz zgłoszeń kandydatów (plik receive_report.py) odbiera zgłoszenie wyniku rekrutacji wysłane z widżetu i od razu zapisuje je w reports – jeszcze przed oceną, czy jest wiarygodne. Dzięki temu żadne zgłoszenie nie zginie, nawet gdy któryś z programów sprawdzających akurat nie działa.", "zadania": ["Odebrać zgłoszenie z widżetu: pseudonim kandydata, identyfikator ogłoszenia, wynik rekrutacji, daty, token Cloudflare i (za zgodą) cechy urządzenia.", "Sprawdzić format danych i to, czy ogłoszenie, którego dotyczy zgłoszenie, istnieje w job_postings.", "Od razu przekazać token Odsiewaczowi botów – token jest ważny tylko 300 sekund.", "Przekazać cechy urządzenia Porównywaczowi odcisków urządzeń, który zwraca skrót urządzenia.", "Zapisać zgłoszenie w reports – ze skrótem urządzenia, bez surowych cech.", "Dodać do task_queue zlecenie dla Oceniacza wiarygodności zgłoszeń: „oceń to zgłoszenie”."], "korzysta": "Czyta job_postings (ogłoszenia), żeby sprawdzić, czy ogłoszenie ze zgłoszenia istnieje.", "zapisuje": "Jest jedynym programem, który zapisuje do reports. Jeden wiersz to jedno zgłoszenie: pseudonim, ogłoszenie, wynik rekrutacji, daty, skrót urządzenia i źródło (zgłoszone samodzielnie albo po przypomnieniu). Zgłoszeń się nie poprawia – tylko dodaje nowe; usuwa się je wyłącznie na wniosek RODO.", "uruchamia": "Uruchamia go widżet (przez Kontrolera kluczy API). On uruchamia Odsiewacza botów, Porównywacza odcisków urządzeń i – przez task_queue – Oceniacza wiarygodności zgłoszeń."}}, {"key": "odsiewacz-botow", "kind": "prog", "name": "Odsiewacz botów", "sub": "verify_turnstile.py", "fields": [["Działa:", "pyta Cloudflare, czy token z formularza jest ważny"], ["Analizuje:", "tylko odpowiedź tak/nie i kody błędów"], ["Oddaje:", "bot_checks – wynik sprawdzenia"]], "reads": [], "writes": ["bot_checks"], "role": {"kim": "Odsiewacz botów (plik verify_turnstile.py) sprawdza w Cloudflare, czy zgłoszenie wysłał człowiek, a nie bot. W pierwotnym pomyśle ten program nazywał się decide_is_reliable_from_cloudflare_data.py.", "zadania": ["Odebrać token od Przyjmowacza zgłoszeń kandydatów.", "Wysłać token do Cloudflare razem z naszym tajnym kluczem Cloudflare.", "Odebrać odpowiedź: token ważny albo nieważny, z ewentualnymi kodami błędów.", "Zapisać w bot_checks: wynik, kody błędów i czas sprawdzenia.", "Gdy Cloudflare nie odpowiada – zapisać „nie sprawdzono”. Później sprawdzić się tego nie da, bo token wygasa, więc takie zgłoszenie dostanie niższą wagę albo trafi do moderatora."], "korzysta": "Nie czyta żadnych zbiorów – token dostaje bezpośrednio od Przyjmowacza zgłoszeń kandydatów.", "zapisuje": "Jest jedynym programem, który zapisuje do bot_checks. Jeden wiersz to wynik sprawdzenia tokenu jednego zgłoszenia.", "uruchamia": "Uruchamia go Przyjmowacz zgłoszeń kandydatów zaraz po odebraniu zgłoszenia. Z bot_checks korzystają Oceniacz wiarygodności zgłoszeń i Wykrywacz kampanii zgłoszeń."}}, {"key": "importer-logu-aplikacji", "kind": "prog", "name": "Importer logu aplikacji", "sub": "import_application_events.py", "fields": [["Działa:", "odbiera od platformy informację, że pseudonim X aplikował na ofertę Y"], ["Analizuje:", "format; statusy z systemu rekrutacji platformy, jeśli je udostępnia"], ["Oddaje:", "application_log"]], "reads": ["partners"], "writes": ["application_log"], "role": {"kim": "Importer logu aplikacji (plik import_application_events.py) zapisuje informacje od platform o tym, kto (pod pseudonimem) i kiedy aplikował na które ogłoszenie. To najmocniejszy dowód przeciw zmyślonym zgłoszeniom: ktoś może wysłać fałszywą skargę, ale w systemie platformy nie będzie aplikacji, której nie złożył.", "zadania": ["Odebrać od platformy wpis: pseudonim, identyfikator ogłoszenia, datę i godzinę aplikacji.", "Sprawdzić format danych według wersji formatu platformy zapisanej w partners.", "Zapisać aplikację w application_log.", "Jeśli platforma przesyła statusy rekrutacji (np. „odrzucono”), zapisać je przy tej aplikacji."], "korzysta": "Czyta partners (lista platform i wersja ich formatu danych).", "zapisuje": "Jest jedynym programem, który zapisuje do application_log. Jeden wiersz to jedna aplikacja: pseudonim, ogłoszenie, data i (jeśli platforma je przesyła) statusy rekrutacji.", "uruchamia": "Uruchamia go platforma (przez Kontrolera kluczy API). Z application_log korzystają Weryfikator złożenia aplikacji, Wysyłacz przypomnień, Wykrywacz kampanii zgłoszeń i Wyliczacz sygnałów o firmach."}}, {"key": "weryfikator-aplikacji", "kind": "prog", "name": "Weryfikator złożenia aplikacji", "sub": "check_application_proof.py", "fields": [["Działa:", "na prośbę Oceniacza wiarygodności zgłoszeń szuka aplikacji zgłaszającego"], ["Analizuje:", "czy naprawdę aplikował i czy minęło dość dni, żeby mówić o ciszy"], ["Oddaje:", "opinię dla Oceniacza wiarygodności zgłoszeń; sam nic nie zapisuje"]], "reads": ["application_log", "system_parameters"], "writes": [], "role": {"kim": "Weryfikator złożenia aplikacji (plik check_application_proof.py) sprawdza w application_log, czy osoba, która wysłała zgłoszenie, naprawdę aplikowała na to ogłoszenie i kiedy. Wynik przekazuje Oceniaczowi wiarygodności zgłoszeń. Sam niczego nie zapisuje w bazie.", "zadania": ["Na prośbę Oceniacza wiarygodności zgłoszeń znaleźć w application_log aplikację z tym samym pseudonimem na to samo ogłoszenie.", "Jeśli zgłoszenie mówi o ciszy – sprawdzić, czy od aplikacji minęło co najmniej tyle dni, ile podaje system_parameters (np. 21). Wcześniej nie można jeszcze uznać, że firma nie odpowiedziała.", "Zauważyć podejrzane wzorce, np. setki aplikacji z jednego pseudonimu w jeden dzień (masowe wysyłanie przez automat).", "Zwrócić Oceniaczowi wiarygodności zgłoszeń wynik: „aplikacja potwierdzona, X dni temu”, „brak aplikacji” albo „za wcześnie, żeby mówić o ciszy”."], "korzysta": "Czyta application_log (aplikacje) i system_parameters (po ilu dniach brak odpowiedzi liczy się jako cisza).", "zapisuje": "Nic. Jego wynik zapisuje Oceniacz wiarygodności zgłoszeń w report_verdicts jako jeden z powodów oceny.", "uruchamia": "Uruchamia go Oceniacz wiarygodności zgłoszeń. Sam nikogo nie uruchamia.", "skroty": "Ghosting (cisza) – sytuacja, gdy firma po aplikacji w ogóle nie odpowiada kandydatowi."}}, {"key": "porownywacz-odciskow", "kind": "prog", "name": "Porównywacz odcisków urządzeń", "sub": "check_this_fingerprint.py", "fields": [["Działa:", "z cech urządzenia liczy skrót (hasz); surowych cech nie zapisuje"], ["Analizuje:", "ile kont i zgłoszeń ma to samo urządzenie"], ["Oddaje:", "device_fingerprints"]], "reads": ["consents"], "writes": ["device_fingerprints"], "role": {"kim": "Porównywacz odcisków urządzeń (plik check_this_fingerprint.py) liczy skrót z cech urządzenia, z którego wysłano zgłoszenie, i sprawdza, ile zgłoszeń z różnych pseudonimów przyszło z tego samego urządzenia. W ten sposób wykrywa jedną osobę, która podaje się za wielu kandydatów.", "zadania": ["Sprawdzić w consents, czy kandydat zgodził się na zbieranie cech urządzenia. Bez zgody niczego nie liczy.", "Z cech urządzenia (np. model karty graficznej, rozdzielczość ekranu, strefa czasowa, język przeglądarki) policzyć skrót i od razu usunąć surowe cechy.", "W device_fingerprints zwiększyć liczniki dla tego skrótu: ile różnych pseudonimów, ile zgłoszeń i ile różnych firm.", "Zwrócić skrót Przyjmowaczowi zgłoszeń kandydatów, który zapisuje go przy zgłoszeniu w reports.", "Wspólny komputer (np. w rodzinie albo w bibliotece) też daje kilka pseudonimów, dlatego ten wynik jest tylko jedną z informacji dla Oceniacza wiarygodności zgłoszeń, a nie decyzją."], "korzysta": "Czyta consents (zgody), żeby wiedzieć, czy wolno mu liczyć skrót.", "zapisuje": "Jest jedynym programem, który zapisuje do device_fingerprints. Jeden wiersz to jeden skrót urządzenia i liczniki. Dane trzymamy krótko (termin jest w system_parameters), bo to dane osobowe.", "uruchamia": "Uruchamia go Przyjmowacz zgłoszeń kandydatów. Z device_fingerprints korzystają Oceniacz wiarygodności zgłoszeń i Wykrywacz kampanii zgłoszeń.", "skroty": "Skrót (hasz) – liczba wyliczona z danych tak, że z niej nie da się odtworzyć danych, ale te same dane zawsze dają ten sam skrót. Odcisk urządzenia (fingerprint) – zestaw cech, po którym można rozpoznać to samo urządzenie."}}, {"key": "wykrywacz-kampanii", "kind": "prog", "name": "Wykrywacz kampanii zgłoszeń", "sub": "detect_report_campaigns.py", "fields": [["Działa:", "regularnie przegląda wszystkie świeże zgłoszenia"], ["Analizuje:", "fale zgłoszeń na jedną firmę z nowych kont i tych samych urządzeń, np. atak konkurencji"], ["Oddaje:", "abuse_alerts"]], "reads": ["reports", "device_fingerprints", "bot_checks", "application_log", "api_access_log"], "writes": ["abuse_alerts"], "role": {"kim": "Wykrywacz kampanii zgłoszeń (plik detect_report_campaigns.py) nie ocenia pojedynczych zgłoszeń, tylko szuka grup zgłoszeń, które wyglądają na zorganizowaną akcję. Przykład: w jeden wieczór przychodzi 300 negatywnych zgłoszeń na jedną firmę z nowych pseudonimów – to może być atak konkurencji.", "zadania": ["Regularnie przeglądać świeże zgłoszenia z reports.", "Szukać nietypowych grup: wiele zgłoszeń na jedną firmę w krótkim czasie, zgłoszenia od pseudonimów bez aplikacji w application_log, wiele zgłoszeń z tego samego urządzenia (device_fingerprints) albo adresu IP (api_access_log), zgłoszenia, które nie przeszły sprawdzenia Cloudflare (bot_checks).", "Szukać też odwrotnego oszustwa: firmy, która sama wysyła o sobie pozytywne zgłoszenia („zatrudniono”).", "Dla każdej znalezionej grupy zapisać alert w abuse_alerts: której firmy dotyczy, w jakim czasie, które zgłoszenia należą do grupy i dlaczego grupa jest podejrzana."], "korzysta": "Czyta reports (zgłoszenia), device_fingerprints (skróty urządzeń), bot_checks (wyniki Cloudflare), application_log (aplikacje) i api_access_log (log zapytań do API z adresami IP).", "zapisuje": "Jest jedynym programem, który zapisuje do abuse_alerts. Jeden wiersz to jedna podejrzana grupa zgłoszeń.", "uruchamia": "Uruchamiają go Uruchamiacz zadań cyklicznych (regularnie) i nagły wzrost liczby zgłoszeń. Nowy alert uruchamia ponowną ocenę przez Oceniacza wiarygodności zgłoszeń i trafia do moderation_queue."}}, {"key": "oceniacz-wiarygodnosci", "kind": "prog", "name": "Oceniacz wiarygodności zgłoszeń", "sub": "check_is_user_complaint_reliable.py", "fields": [["Działa:", "zbiera wynik Odsiewacza botów i opinie Weryfikatora złożenia aplikacji, Porównywacza odcisków urządzeń i Wykrywacza kampanii zgłoszeń"], ["Analizuje:", "łączy wszystkie opinie w jedną wagę 0–1"], ["Oddaje:", "decyzję: przyjęte, do moderacji albo odrzucone – z powodami (report_verdicts)"]], "reads": ["reports", "bot_checks", "device_fingerprints", "abuse_alerts", "moderator_decisions", "system_parameters"], "writes": ["report_verdicts"], "role": {"kim": "Oceniacz wiarygodności zgłoszeń (plik check_is_user_complaint_reliable.py) decyduje, czy zgłoszenie kandydata liczy się do Trust Score. Sam nie sprawdza danych – zbiera wyniki czterech sprawdzeń (Odsiewacz botów, Weryfikator złożenia aplikacji, Porównywacz odcisków urządzeń, Wykrywacz kampanii zgłoszeń), łączy je w jedną wagę i zapisuje decyzję.", "zadania": ["Pobrać zlecenie z task_queue i zgłoszenie z reports.", "Zebrać wyniki sprawdzeń: z bot_checks (człowiek czy bot), od Weryfikatora złożenia aplikacji (czy aplikował i kiedy), z device_fingerprints (ile pseudonimów ma to urządzenie) i z abuse_alerts (czy zgłoszenie należy do podejrzanej grupy).", "Policzyć wagę zgłoszenia od 0 (bez znaczenia) do 1 (w pełni wiarygodne) według wag i progów z system_parameters.", "Podjąć decyzję: „przyjęte” (liczy się do Trust Score), „do moderacji” (zdecyduje moderator) albo „odrzucone”.", "Zapisać w report_verdicts: wagę, decyzję, powody (np. „brak aplikacji w logu”) i wersję reguł.", "Ocenić zgłoszenie ponownie, gdy pojawi się nowy alert albo decyzja moderatora w moderator_decisions. Nowa ocena to nowy wiersz – stara zostaje w historii."], "korzysta": "Czyta reports (zgłoszenia), bot_checks (wyniki Cloudflare), device_fingerprints (skróty urządzeń), abuse_alerts (alerty o podejrzanych grupach), moderator_decisions (decyzje moderatorów) i system_parameters (wagi i progi).", "zapisuje": "Jest jedynym programem, który zapisuje do report_verdicts. Z reports i report_verdicts liczony jest widok validated_reports – tylko zgłoszenia, których najnowsza decyzja to „przyjęte”. To odpowiednik dawnego pliku walidated_users_failed_job_application.csv.", "uruchamia": "Uruchamiają go Przyjmowacz zgłoszeń kandydatów (nowe zgłoszenie), Wykrywacz kampanii zgłoszeń (nowy alert) i Zapisywacz decyzji moderatora (nowa decyzja). Sam prosi o wynik Weryfikatora złożenia aplikacji. Zgłoszenia z decyzją „do moderacji” trafiają do moderation_queue, którą moderator przegląda w Zapisywaczu decyzji moderatora.", "skroty": "Widok – zapisane zapytanie SQL, które za każdym razem liczy wynik na bieżąco z innych tabel, więc nigdy nie różni się od nich. Waga – liczba od 0 do 1 mówiąca, jak bardzo ufamy zgłoszeniu."}}, {"key": "wysylacz-przypomnien", "kind": "prog", "name": "Wysyłacz przypomnień", "sub": "remind_candidates.py", "fields": [["Działa:", "po ustalonej liczbie dni od aplikacji prosi platformę, żeby zapytała kandydata o wynik"], ["Analizuje:", "komu wolno przypomnieć (zgoda) i komu już przypomniano"], ["Oddaje:", "reminders_sent; skutek: dużo więcej zgłoszeń"]], "reads": ["application_log", "consents", "system_parameters"], "writes": ["reminders_sent"], "role": {"kim": "Wysyłacz przypomnień (plik remind_candidates.py) po ustalonej liczbie dni od aplikacji prosi platformę, żeby zapytała kandydata, czy firma się odezwała. Większość kandydatów sama nie zgłasza wyniku – przypomnienia sprawiają, że dostajemy dużo więcej zgłoszeń, także pozytywnych (zatrudnienie).", "zadania": ["Znaleźć w application_log aplikacje, od których minęła liczba dni ustawiona w system_parameters.", "Sprawdzić w consents, czy kandydat zgodził się na przypomnienia.", "Sprawdzić w reminders_sent, czy temu kandydatowi w sprawie tej aplikacji jeszcze nie przypominano.", "Wysłać do platformy prośbę o przypomnienie (pseudonim i ogłoszenie). E-mail wysyła platforma, bo tylko ona zna adres kandydata.", "Zapisać w reminders_sent, że przypomnienie wysłano i kiedy."], "korzysta": "Czyta application_log (aplikacje), consents (zgody) i system_parameters (po ilu dniach przypominać).", "zapisuje": "Jest jedynym programem, który zapisuje do reminders_sent. Jeden wiersz to jedno wysłane przypomnienie: pseudonim, ogłoszenie, data.", "uruchamia": "Uruchamia go Uruchamiacz zadań cyklicznych. Jeśli kandydat odpowie na przypomnienie, odpowiedź przychodzi przez widżet do Przyjmowacza zgłoszeń kandydatów jako zwykłe zgłoszenie, oznaczone jako wysłane po przypomnieniu."}}, {"key": "rejestrator-zgod", "kind": "prog", "name": "Rejestrator zgód kandydatów", "sub": "record_consent.py", "fields": [["Działa:", "zapisuje zgodę albo jej wycofanie"], ["Analizuje:", "na co jest zgoda (przypomnienia, cechy urządzenia) i w jakiej wersji treści"], ["Oddaje:", "consents – dowód zgody wymagany przez RODO"]], "reads": [], "writes": ["consents"], "role": {"kim": "Rejestrator zgód kandydatów (plik record_consent.py) zapisuje każdą zgodę kandydata i każde jej wycofanie. RODO wymaga, żebyśmy umieli udowodnić, kto, kiedy i na co się zgodził oraz jaką treść zgody widział.", "zadania": ["Odebrać z widżetu informację o udzieleniu albo wycofaniu zgody.", "Zapisać w consents: pseudonim, rodzaj zgody (przypomnienia albo zbieranie cech urządzenia), decyzję (tak albo nie), datę i wersję treści zgody.", "Nie zmieniać starych wpisów – wycofanie zgody to nowy wiersz, więc widać pełną historię."], "korzysta": "Nie czyta żadnych zbiorów.", "zapisuje": "Jest jedynym programem, który zapisuje do consents.", "uruchamia": "Uruchamia go widżet (formularz zgody consent_prompt.js). Z consents korzystają Porównywacz odcisków urządzeń, Wysyłacz przypomnień i Realizator wniosków RODO.", "skroty": "RODO – unijne rozporządzenie o ochronie danych osobowych."}}], "stores": [{"key": "application_log", "kind": "store", "name": "application_log", "sub": "dziennik aplikacji", "fields": [["Przechowuje:", "pseudonim, ofertę i datę aplikacji, a jeśli platforma je ma – statusy rekrutacji"], ["Po co:", "dowód, że zgłaszający aplikował; pozwala liczyć zgłoszenia na 100 aplikacji"]]}, {"key": "reports", "kind": "store", "name": "reports", "sub": "zgłoszenia kandydatów", "fields": [["Przechowuje:", "wynik (cisza, odmowa, zatrudnienie…), daty, skrót urządzenia; tylko dopisujemy"], ["Po co:", "surowy głos kandydatów – liczy się dopiero po ocenie Oceniacza wiarygodności zgłoszeń"]]}, {"key": "device_fingerprints", "kind": "store", "name": "device_fingerprints", "sub": "odciski urządzeń", "fields": [["Przechowuje:", "skrót urządzenia i liczniki: ile kont, zgłoszeń i różnych firm"], ["Po co:", "wykrywa jedną osobę z wieloma kontami; trzymany krótko, bo to dane osobowe"]]}, {"key": "abuse_alerts", "kind": "store", "name": "abuse_alerts", "sub": "alerty nadużyć", "fields": [["Przechowuje:", "podejrzaną falę zgłoszeń: firmę, okno czasu, zgłoszenia w grupie, powód"], ["Po co:", "wstrzymuje atak, zanim zaszkodzi firmie; sprawa trafia do moderatora"]]}, {"key": "report_verdicts", "kind": "store", "name": "report_verdicts", "sub": "oceny zgłoszeń", "fields": [["Przechowuje:", "wagę 0–1, decyzję, powody, wersję reguł; nowa ocena = nowy wiersz"], ["Po co:", "wiadomo, dlaczego zgłoszenie się liczy albo nie; można je ocenić ponownie"]]}, {"key": "validated_reports", "kind": "store", "name": "validated_reports (widok)", "sub": "zgłoszenia zwalidowane", "fields": [["Przechowuje:", "nic osobno – to zapytanie łączące reports z najnowszą oceną „przyjęte”"], ["Po co:", "to Twój dawny plik .csv; widok nie rozjedzie się z ocenami, kopia mogłaby"]], "viewOf": ["reports", "report_verdicts"]}]}, {"id": 4, "name": "Dział Analiz (Trust Score)", "mapTitle": "4. Dział Analiz (Trust Score)", "storeGroup": "Trust Score i AI", "finding": "z sygnałów powstaje Trust Score, a ostrzeżenia zatwierdza człowiek", "link": "Kandydat i firma widzą wyłącznie published_trust_scores – przez warstwę 5.", "band1": "SKĄD BIERZEMY DANE", "arrow1": "dane trafiają do programów", "note": "Wynik roboczy (trust_score_history) i wynik publiczny (published_trust_scores) to celowo dwa osobne zbiory.", "mapSources": [{"kind": "sys", "name": "Model AI", "detail": "teczki spraw (LLM)"}, {"kind": "person", "name": "Personel", "detail": "wagi i etykiety"}], "flowNext": "warstwa 5 czyta opublikowany wynik (published_trust_scores)", "sources": [{"key": "model-ai-teczki", "kind": "sys", "name": "Model AI", "sub": "zewnętrzny model językowy", "fields": [["Bierzemy:", "teczki spraw – streszczenie dowodów dla moderatora: oś czasu, liczby"], ["Nie robi:", "sam nie wystawia wyniku i niczego nie publikuje"]], "talks": ["posrednik-ai", "kompletowacz-teczek"], "role": {"kim": "Ten sam zewnętrzny model językowy co w warstwie 2, ale tutaj pisze streszczenia spraw dla moderatora. Dostaje zebrane fakty o firmie i zwraca czytelny opis. Nie wystawia wyniku i niczego nie publikuje – decyzję zawsze podejmuje człowiek.", "zadania": ["Na prośbę Kompletowacza teczek spraw streścić sprawę: oś czasu ogłoszeń firmy, pary podobnych ogłoszeń, liczbę i rodzaje zgłoszeń oraz treść odwołania firmy."], "korzysta": "Dostaje tylko dane zbiorcze o firmie i jej ogłoszeniach, bez pseudonimów i innych danych kandydatów.", "zapisuje": "Sam nic nie zapisuje. Streszczenie zapisuje Kompletowacz teczek spraw w case_files.", "uruchamia": "Niczego nie uruchamia. Zapytania wysyła do niego Pośrednik zapytań do AI w imieniu Kompletowacza teczek spraw.", "skroty": "LLM – duży model językowy."}}, {"key": "personel", "kind": "person", "name": "Personel", "sub": "nasi ludzie: administrator i moderatorzy", "fields": [["Dają:", "wagi i progi Trust Score oraz etykiety – decyzje, z których uczy się model"]], "talks": ["edytor-ustawien", "zapisywacz-decyzji"], "role": {"kim": "Personel to nasi pracownicy: administrator i moderatorzy. W tej warstwie ustalają zasady liczenia Trust Score i rozstrzygają sprawy, w których automat mógłby się pomylić.", "zadania": ["Administrator: ustawić na start wagi i progi Trust Score w system_parameters. Zanim powstanie wytrenowany model, zasady liczenia ustala zespół.", "Moderatorzy: rozstrzygać sprawy sporne. Każda decyzja zapisana w moderator_decisions staje się później etykietą, na której uczy się model."], "korzysta": "Korzysta z bazy tylko przez programy: administrator przez Edytora ustawień systemu, moderatorzy przez Zapisywacza decyzji moderatora.", "zapisuje": "Ustawienia zapisuje Edytor ustawień systemu w system_parameters, a decyzje – Zapisywacz decyzji moderatora w moderator_decisions.", "uruchamia": "Zmiana wag i progów powoduje ponowne przeliczenie wyników przez Wystawiacza Trust Score. Decyzja moderatora uruchamia Publikatora Trust Score i Wyliczacza sygnałów o firmach.", "skroty": "Etykieta – poprawna odpowiedź przypisana do przykładu, np. „ta firma publikuje ghost joby”."}}], "programs": [{"key": "wyliczacz-sygnalow", "kind": "prog", "name": "Wyliczacz sygnałów o firmach", "sub": "compute_employer_signals.py", "fields": [["Działa:", "regularnie liczy liczby opisujące każdą firmę"], ["Analizuje:", "odsetek powtórek, ciszę i zatrudnienia na 100 aplikacji, widełki, flagi z rejestru, wyniki odwołań"], ["Oddaje:", "employer_signals – migawkę na dany dzień"]], "reads": ["posting_lifecycles", "posting_families", "posting_features", "validated_reports", "application_log", "registry_snapshots", "employers", "moderator_decisions"], "writes": ["employer_signals"], "role": {"kim": "Wyliczacz sygnałów o firmach (plik compute_employer_signals.py) regularnie liczy dla każdej firmy zestaw liczb – sygnałów – z których powstaje Trust Score. Bierze je z wielu zbiorów warstw 1–3 i zapisuje jako stan na dany dzień.", "zadania": ["Z posting_families i posting_lifecycles policzyć: jaka część ogłoszeń firmy to powtórki, ile razy średnio publikowane jest jedno stanowisko i jak długo ogłoszenia są widoczne.", "Z validated_reports i application_log policzyć na 100 aplikacji: ile zgłoszeń ciszy, ile odmów, ile zatrudnień. Liczenie na 100 aplikacji jest potrzebne, żeby duża firma nie wypadała gorzej tylko dlatego, że ma więcej kandydatów.", "Z posting_features policzyć, jaka część ogłoszeń podaje widełki płacowe.", "Z registry_snapshots i employers dodać informacje z rejestrów, np. „firma wykreślona” albo „zarejestrowana 2 tygodnie temu”.", "Z moderator_decisions uwzględnić rozstrzygnięte odwołania, np. „stanowisko obsadzone – potwierdzone”.", "Zapisać wszystkie liczby w employer_signals jako nowy wiersz z datą."], "korzysta": "Czyta posting_lifecycles (cykle życia), posting_families (rodziny ogłoszeń), posting_features (cechy ogłoszeń), validated_reports (przyjęte zgłoszenia – widok), application_log (aplikacje), registry_snapshots (wyniki z rejestrów), employers (firmy) i moderator_decisions (decyzje moderatorów).", "zapisuje": "Jest jedynym programem, który zapisuje do employer_signals. Jeden wiersz to wszystkie sygnały jednej firmy na jeden dzień.", "uruchamia": "Uruchamiają go Uruchamiacz zadań cyklicznych (regularnie), decyzja moderatora i Realizator wniosków RODO (po usunięciu danych). Po zapisaniu przekazuje pracę Wystawiaczowi Trust Score.", "skroty": "Sygnał – jedna liczba opisująca firmę, np. „38% ogłoszeń to powtórki”."}}, {"key": "wystawiacz-trust-score", "kind": "prog", "name": "Wystawiacz Trust Score", "sub": "compute_trust_score.py", "fields": [["Działa:", "z sygnałów liczy wynik 0–100: na start wagi od zespołu, później model"], ["Analizuje:", "ile danych stoi za wynikiem – to jego pewność"], ["Oddaje:", "trust_score_history z głównymi powodami"]], "reads": ["employer_signals", "system_parameters", "model_registry"], "writes": ["trust_score_history"], "role": {"kim": "Wystawiacz Trust Score (plik compute_trust_score.py) z sygnałów firmy liczy jej Trust Score – liczbę od 0 do 100, gdzie wyższa oznacza bardziej wiarygodnego pracodawcę. Przy każdym wyniku zapisuje pewność i główne powody.", "zadania": ["Pobrać najnowszy wiersz firmy z employer_signals.", "Policzyć wynik 0–100: na start według wag i progów ustawionych przez zespół w system_parameters, później według modelu oznaczonego jako aktywny w model_registry.", "Policzyć pewność wyniku. Zależy od liczby danych: wynik z 2 zgłoszeń jest dużo mniej pewny niż z 200.", "Wypisać 2–3 główne powody, np. „to samo ogłoszenie 7 razy w 9 miesięcy”.", "Dopisać wynik do trust_score_history jako nowy wiersz – starych wyników nie nadpisuje."], "korzysta": "Czyta employer_signals (sygnały firm), system_parameters (wagi i progi) i model_registry (który model jest aktywny).", "zapisuje": "Jest jedynym programem, który zapisuje do trust_score_history. Jeden wiersz to jeden wynik: firma, data, wynik, pewność, powody i wersja modelu albo reguł. To wynik roboczy – kandydaci i firmy go nie widzą.", "uruchamia": "Uruchamia go Wyliczacz sygnałów o firmach. Po zapisaniu przekazuje pracę Publikatorowi Trust Score.", "skroty": "Trust Score – wskaźnik wiarygodności pracodawcy od 0 do 100. Pewność – jak wiele danych stoi za wynikiem."}}, {"key": "kompletowacz-teczek", "kind": "prog", "name": "Kompletowacz teczek spraw", "sub": "llm_case_analyst.py", "fields": [["Działa:", "dla spraw granicznych i odwołań prosi AI o streszczenie"], ["Analizuje:", "oś czasu ogłoszeń, podobieństwa, liczby zgłoszeń"], ["Oddaje:", "case_files – teczkę dla moderatora"]], "reads": ["posting_families", "similar_posting_pairs", "employer_signals", "report_verdicts", "appeals"], "writes": ["case_files"], "role": {"kim": "Kompletowacz teczek spraw (plik llm_case_analyst.py) przygotowuje dla moderatora teczkę sprawy – jeden wpis w case_files, który zbiera w jednym miejscu fakty o firmie i ich streszczenie napisane przez model AI. Dzięki temu moderator nie musi sam przeglądać setek wierszy w różnych zbiorach.", "zadania": ["Wybrać sprawy do przygotowania: firmy z wynikiem blisko progu ostrzeżenia i nowe odwołania z appeals.", "Zebrać fakty: rodziny ogłoszeń z posting_families, pary podobnych ogłoszeń z similar_posting_pairs, sygnały z employer_signals, oceny zgłoszeń z report_verdicts i treść odwołania z appeals.", "Wysłać fakty (bez danych kandydatów) przez Pośrednika zapytań do AI do modelu językowego z prośbą o streszczenie.", "Zapisać fakty i streszczenie w case_files."], "korzysta": "Czy
